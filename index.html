<script>
  function showBootError(msg) {
    var root = document.getElementById("root");
    if (!root || root.hasChildNodes()) return;
    root.innerHTML =
      '<div style="font-family:-apple-system,sans-serif;max-width:520px;margin:15vh auto;padding:24px;' +
      'border:1px solid #e6dcc7;border-radius:16px;background:#fff8f6;color:#7a2f2f;">' +
      '<h2 style="margin:0 0 8px;font-size:18px;">StoryDesk couldn\'t start</h2>' +
      '<p style="font-size:14px;line-height:1.5;margin:0 0 8px;white-space:pre-wrap;">' + msg + '</p>' +
      '<p style="font-size:12px;color:#9a8f7f;margin:0;">This file loads React, Babel, and icons from a CDN — ' +
      'make sure you\'re connected to the internet, then reload the page.</p></div>';
  }
  window.addEventListener("error", function (e) {
    showBootError((e.message || "Unknown error") + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    showBootError((reason && reason.message) ? reason.message : String(reason));
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && !root.hasChildNodes()) {
      showBootError("The app didn't finish loading within 10 seconds. This usually means a CDN script (React, Babel, or the icon library) failed to load — check your internet connection and open the browser console (F12) for details.");
    }
  }, 10000);
</script>

<script>
  // Stands in for the storage API StoryDesk uses inside Claude's artifact
  // sandbox, backed here by real browser localStorage — so the exact same
  // app code works as a normal static website with no other changes.
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) throw new Error("StoryDesk storage: key not found");
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix };
    },
  };
</script>

/* ---------------------------- utils ---------------------------- */

let idCounter = 0;
function uid(prefix = "id") {
  idCounter += 1;
  return `${prefix}_${Date.now().toString(36)}_${idCounter}_${Math.random().toString(36).slice(2, 7)}`;
}
function wordCount(text) {
  if (!text) return 0;
  const m = text.match(WORD_RE);
  return m ? m.length : 0;
}
function readingTime(words) {
  const mins = Math.max(1, Math.round(words / 200));
  return `${mins} min read`;
}
function todayStr(d = new Date()) {
  return d.toISOString().slice(0, 10);
}
function daysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return todayStr(d);
}
function timeAgo(iso) {
  if (!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function pct(a, b) { return b > 0 ? clamp(Math.round((a / b) * 100), 0, 100) : 0; }

/* ---- data safety helpers (Phase 8) ---- */

const BACKUP_REMINDER_DAYS = 14;
const BACKUP_REMINDER_SNOOZE_DAYS = 7;
const AUTO_BACKUP_MIN_GAP_DAYS = 1;
const AUTO_BACKUP_MAX_KEPT = 3;

function daysBetween(fromIso, toMs = Date.now()) {
  if (!fromIso) return Infinity;
  return (toMs - new Date(fromIso).getTime()) / 86400000;
}

function shouldShowBackupReminder(ws) {
  if (!ws.stories?.length) return false;
  const ref = ws.lastBackupAt || ws.createdAt;
  if (daysBetween(ref) < BACKUP_REMINDER_DAYS) return false;
  if (ws.backupReminderDismissedAt && daysBetween(ws.backupReminderDismissedAt) < BACKUP_REMINDER_SNOOZE_DAYS) return false;
  return true;
}

function shouldTakeAutoBackup(ws) {
  if (!ws.stories?.length) return false;
  const backups = ws.autoBackups || [];
  const last = backups[backups.length - 1];
  return !last || daysBetween(last.savedAt) >= AUTO_BACKUP_MIN_GAP_DAYS;
}

function makeAutoBackupEntry(ws) {
  const { autoBackups, ...rest } = ws;
  return { id: uid("bak"), savedAt: new Date().toISOString(), data: JSON.stringify(rest) };
}

/* ---- manual Wattpad performance tracking (Session 5 — user-entered numbers only, no scraping/API) ---- */

function wattpadMetricsForStory(story) {
  const stats = [...(story.wattpadStats || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
  const latest = stats[stats.length - 1] || null;
  const prev = stats[stats.length - 2] || null;
  const engagementRate = latest && latest.reads ? ((latest.votes || 0) + (latest.comments || 0)) / latest.reads : null;
  const voteToReadRatio = latest && latest.reads ? (latest.votes || 0) / latest.reads : null;
  const commentToReadRatio = latest && latest.reads ? (latest.comments || 0) / latest.reads : null;
  const growthRate = latest && prev && prev.reads ? (latest.reads - prev.reads) / prev.reads : null;

  const chapters = story.chapters || [];
  const withReads = chapters.filter((c) => (c.reads || 0) > 0);
  const bestChapter = withReads.length ? withReads.reduce((a, b) => (b.reads > a.reads ? b : a)) : null;
  const totalReads = chapters.reduce((s, c) => s + (c.reads || 0), 0);
  const avgReadsPerChapter = chapters.length ? Math.round(totalReads / chapters.length) : 0;

  return { latest, prev, engagementRate, voteToReadRatio, commentToReadRatio, growthRate, bestChapter, avgReadsPerChapter, totalReads };
}

function formatPct1(n) { return n === null || n === undefined || Number.isNaN(n) ? "—" : `${(n * 100).toFixed(1)}%`; }

/* ---- Writer Health Score (Session 5 — rules + the writer's own data, no AI/prediction) ---- */

function computeHealthScore(ws) {
  const avg7 = recentDailyAverage(ws.dailyLog, 7);
  const writingScore = clamp(Math.round((avg7 / (ws.goals.dailyWords || 500)) * 100), 0, 100);

  let activeDays = 0;
  for (let i = 0; i < 30; i++) { if ((ws.dailyLog[daysAgoStr(i)] || 0) > 0) activeDays++; }
  const consistencyScore = Math.round((activeDays / 30) * 100);

  const completedRecently = ws.stories.flatMap((s) => s.chapters).filter((c) => c.status === "Complete" && daysBetween(c.updatedAt) <= 30).length;
  const publishingScore = clamp(Math.round((completedRecently / 4) * 100), 0, 100);

  const engagementRates = ws.stories.map((s) => wattpadMetricsForStory(s).engagementRate).filter((r) => r !== null);
  const engagementScore = engagementRates.length ? clamp(Math.round((engagementRates.reduce((a, b) => a + b, 0) / engagementRates.length) * 1000), 0, 100) : null;

  const parts = [writingScore, consistencyScore, publishingScore, engagementScore].filter((v) => v !== null);
  const overall = parts.length ? Math.round(parts.reduce((a, b) => a + b, 0) / parts.length) : 0;

  return { writingScore, consistencyScore, publishingScore, engagementScore, overall };
}

/* ---- cover image handling (Session 5 — resized + compressed client-side, no upload) ---- */

function resizeImageFile(file, maxDim = 480) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read that file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Couldn't read that image"));
      img.onload = () => {
        const ratio = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * ratio);
        const h = Math.round(img.naturalHeight * ratio);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        const aspect = img.naturalWidth / img.naturalHeight;
        const wattpadReady = aspect > 0.55 && aspect < 0.75; // Wattpad recommends ~512x800 (0.64)
        resolve({ dataUrl, wattpadReady });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---- writing craft analysis (Phase 4, plain heuristics, no AI) ---- */

const CRAFT_STOP_WORDS = new Set(["the","a","an","and","or","but","of","to","in","on","at","for","with","is","was","were","are","be","been","being","it","its","he","she","they","him","her","them","i","you","we","that","this","these","those","as","his","their","not","had","have","has","did","do","does","so","if","then","than","there","what","who","when","where","which","how","from","by","said","into","out","up","down","over","under","after","before","about","just","also"]);
const CRAFT_FILLER_WORDS = ["very", "really", "just", "quite", "actually", "basically", "literally", "somewhat", "rather", "extremely", "totally", "definitely", "suddenly"];

function analyzeChapterText(plainText) {
  const words = (plainText.toLowerCase().match(/[a-z']+/g) || []);
  const total = words.length || 1;

  const freq = {};
  words.forEach((w) => { if (w.length > 3 && !CRAFT_STOP_WORDS.has(w)) freq[w] = (freq[w] || 0) + 1; });
  const repeated = Object.entries(freq).filter(([, n]) => n >= 5).sort((a, b) => b[1] - a[1]).slice(0, 6);

  const adverbs = words.filter((w) => w.endsWith("ly") && w.length > 4 && !CRAFT_STOP_WORDS.has(w)).length;
  const fillers = words.filter((w) => CRAFT_FILLER_WORDS.includes(w)).length;
  const densityPct = Math.round(((adverbs + fillers) / total) * 1000) / 10;

  const dialogueMatches = plainText.match(/["“][^"”]*["”]|'[^']*'/g) || [];
  const dialogueChars = dialogueMatches.join("").length;
  const totalChars = plainText.length || 1;
  const dialoguePct = Math.round((dialogueChars / totalChars) * 100);

  return { repeated, adverbs, fillers, densityPct, dialoguePct, totalWords: total };
}

function initialsOf(name) {
  return (name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]?.toUpperCase()).join("");
}

/* ---- rich text helpers (Phase 1) ---- */

function htmlToPlainText(html) {
  if (!html) return "";
  return html
    .replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi, " ")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|li|blockquote|h[1-6])>/gi, "\n")
    .replace(/<hr[^>]*>/gi, " ")
    .replace(/<[^>]+>/g, "")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">");
}

function htmlToWattpadText(html) {
  if (!html) return "";
  return html
    .replace(/<hr[^>]*>/gi, "\n\n* * *\n\n")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|li)>/gi, "\n\n")
    .replace(/<blockquote[^>]*>/gi, "> ")
    .replace(/<\/blockquote>/gi, "\n\n")
    .replace(/<[^>]+>/g, "")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function looksLikeHtml(str) { return /<\/?[a-z][\s\S]*>/i.test(str || ""); }

/* ---- export helpers: EPUB + print (Phase 7) ---- */

function escapeXml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function sanitizeForXhtml(html) {
  return (html || "")
    .replace(/<hr(?![^>]*\/>)[^>]*>/gi, "<hr/>")
    .replace(/<br(?![^>]*\/>)[^>]*>/gi, "<br/>");
}

const PRINT_STYLE = `
  body { font-family: Georgia, 'Times New Roman', serif; line-height: 1.7; color: #222; }
  h1 { font-size: 1.5em; margin-bottom: 1em; }
  p { margin: 0 0 1.1em 0; }
  hr { border: none; text-align: center; margin: 1.8em 0; }
  hr::after { content: "· · ·"; letter-spacing: 0.3em; color: #999; }
  blockquote { border-left: 3px solid #999; padding-left: 1em; font-style: italic; color: #555; margin: 0 0 1.1em 0; }
`;

async function buildEpubBlob(story, chapters) {
  const zip = new JSZip();
  zip.file("mimetype", "application/epub+zip", { compression: "STORE" });
  zip.folder("META-INF").file("container.xml",
    `<?xml version="1.0" encoding="UTF-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);

  const oebps = zip.folder("OEBPS");
  const bookId = "urn:uuid:" + uid("book");
  const modified = new Date().toISOString().replace(/\.\d+Z$/, "Z");

  chapters.forEach((c, i) => {
    const body = sanitizeForXhtml(normalizeChapterHtml(c.content));
    oebps.file(`chap${i + 1}.xhtml`, `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"><head><meta charset="utf-8"/><title>${escapeXml(c.title || "Untitled")}</title>
<style>${PRINT_STYLE}</style></head>
<body><h1>${escapeXml(c.title || "Untitled")}</h1>${body}</body></html>`);
  });

  const manifestItems = chapters.map((c, i) => `<item id="chap${i + 1}" href="chap${i + 1}.xhtml" media-type="application/xhtml+xml"/>`).join("\n    ");
  const spineItems = chapters.map((c, i) => `<itemref idref="chap${i + 1}"/>`).join("\n    ");
  oebps.file("content.opf", `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="BookId">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:identifier id="BookId">${bookId}</dc:identifier>
    <dc:title>${escapeXml(story.title)}</dc:title>
    <dc:language>en</dc:language>
    <meta property="dcterms:modified">${modified}</meta>
  </metadata>
  <manifest>
    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
    <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
    ${manifestItems}
  </manifest>
  <spine toc="ncx">
    ${spineItems}
  </spine>
</package>`);

  const navPoints = chapters.map((c, i) => `<navPoint id="navPoint-${i + 1}" playOrder="${i + 1}"><navLabel><text>${escapeXml(c.title || "Untitled")}</text></navLabel><content src="chap${i + 1}.xhtml"/></navPoint>`).join("\n    ");
  oebps.file("toc.ncx", `<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head><meta name="dtb:uid" content="${bookId}"/></head>
  <docTitle><text>${escapeXml(story.title)}</text></docTitle>
  <navMap>
    ${navPoints}
  </navMap>
</ncx>`);

  const navLinks = chapters.map((c, i) => `<li><a href="chap${i + 1}.xhtml">${escapeXml(c.title || "Untitled")}</a></li>`).join("\n      ");
  oebps.file("nav.xhtml", `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">
<head><meta charset="utf-8"/><title>Contents</title></head>
<body><nav epub:type="toc" id="toc"><h1>Contents</h1><ol>
      ${navLinks}
    </ol></nav></body></html>`);

  return zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
}

function printChapters(chapters) {
  const win = window.open("", "_blank");
  if (!win) return false;
  const body = chapters.map((c) => `<h1>${escapeXml(c.title || "Untitled")}</h1>${sanitizeForXhtml(normalizeChapterHtml(c.content))}`).join('<div style="page-break-after: always;"></div>');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"/><title>${escapeXml(chapters[0]?.title || "Print")}</title>
<style>body{max-width:680px;margin:40px auto;padding:0 20px;} ${PRINT_STYLE} @media print { body { margin: 0; } }</style>

}

// Converts a chapter's rich-text HTML into DOCX paragraphs/runs (bold, italic,
// underline, blockquotes, scene dividers), using the browser's own DOMParser.
function htmlToDocxParagraphs(html) {
  const { Paragraph, TextRun, AlignmentType } = DocxLib;
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const root = doc.body.firstChild;
  const paragraphs = [];

  function runsFromNode(node, marks = {}) {
    let runs = [];
    node.childNodes.forEach((child) => {
      if (child.nodeType === 3) {
        if (child.textContent) runs.push(new TextRun({ text: child.textContent, bold: !!marks.bold, italics: !!marks.italic, underline: marks.underline ? {} : undefined }));
      } else if (child.nodeType === 1) {
        const tag = child.tagName.toLowerCase();
        const nextMarks = { ...marks };
        if (tag === "strong" || tag === "b") nextMarks.bold = true;
        if (tag === "em" || tag === "i") nextMarks.italic = true;
        if (tag === "u") nextMarks.underline = true;
        runs = runs.concat(runsFromNode(child, nextMarks));
      }
    });
    return runs;
  }

  (root ? root.childNodes : []).forEach((node) => {
    const tag = node.nodeType === 1 ? node.tagName.toLowerCase() : null;
    if (tag === "hr") {
      paragraphs.push(new Paragraph({ text: "· · ·", alignment: AlignmentType.CENTER, spacing: { before: 200, after: 200 } }));
    } else if (tag === "blockquote") {
      const runs = runsFromNode(node, { italic: true });
      if (runs.length) paragraphs.push(new Paragraph({ children: runs, indent: { left: 480 }, spacing: { after: 200 } }));
    } else if (node.nodeType === 1) {
      const runs = runsFromNode(node);
      if (runs.length) paragraphs.push(new Paragraph({ children: runs, spacing: { after: 200 } }));
    } else if (node.nodeType === 3 && node.textContent.trim()) {
      paragraphs.push(new Paragraph({ text: node.textContent, spacing: { after: 200 } }));
    }
  });
  if (paragraphs.length === 0) paragraphs.push(new Paragraph({ text: "" }));
  return paragraphs;
}

async function buildDocxBlob(story, chapters) {
  const { Document, Packer, Paragraph, HeadingLevel } = DocxLib;
  const sections = [{
    properties: {},
    children: chapters.flatMap((c) => [
      new Paragraph({ text: c.title || "Untitled", heading: HeadingLevel.HEADING_1, spacing: { after: 300 } }),
      ...htmlToDocxParagraphs(normalizeChapterHtml(c.content)),
    ]),
  }];
  const doc = new Document({ title: story?.title || "StoryDesk Export", sections });
  return Packer.toBlob(doc);
}


// Converts older plain/markdown-lite chapter text into the new rich editor's HTML,
// so chapters written before Phase 1 still open and display correctly.
function legacyTextToHtml(text) {
  if (!text) return "";
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const withScene = escaped.replace(/\n?\*\*\*\n?/g, "\n<hr/>\n");
  const withBold = withScene.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const withItalic = withBold.replace(/\*(.+?)\*/g, "<em>$1</em>");
  const withUnderline = withItalic.replace(/__(.+?)__/g, "<u>$1</u>");
  return withUnderline.split("\n").map((line) => {
    const trimmed = line.trim();
    if (trimmed === "<hr/>") return "<hr/>";
    if (trimmed.startsWith("&gt; ")) return `<blockquote>${trimmed.slice(5)}</blockquote>`;
    if (trimmed === "") return "<br/>";
    return `<p>${line}</p>`;
  }).join("");
}

function normalizeChapterHtml(raw) {
  if (!raw) return "";
  return looksLikeHtml(raw) ? raw : legacyTextToHtml(raw);
}

// Caret offset helpers for contentEditable — used to restore the cursor
// to where the writer last left off in a chapter.
function getCaretCharacterOffsetWithin(element) {
  let caretOffset = 0;
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    const preCaretRange = range.cloneRange();
    preCaretRange.selectNodeContents(element);
    preCaretRange.setEnd(range.endContainer, range.endOffset);
    caretOffset = preCaretRange.toString().length;
  }
  return caretOffset;
}

function setCaretPosition(element, offset) {
  const range = document.createRange();
  const sel = window.getSelection();
  let currentOffset = 0;
  let found = false;
  function traverse(node) {
    if (found) return;
    if (node.nodeType === 3) {
      const nextOffset = currentOffset + node.length;
      if (offset <= nextOffset) {
        range.setStart(node, Math.max(0, offset - currentOffset));
        range.collapse(true);
        found = true;
        return;
      }
      currentOffset = nextOffset;
    } else {
      for (const child of node.childNodes) { traverse(child); if (found) return; }
    }
  }
  traverse(element);
  if (!found) { range.selectNodeContents(element); range.collapse(false); }
  sel.removeAllRanges();
  sel.addRange(range);
}

function storyTotals(story) {
  const chapters = story.chapters || [];
  const words = chapters.reduce((s, c) => s + (c.wordCount || 0), 0);
  const complete = chapters.filter((c) => c.status === "Complete").length;
  return { words, chapters: chapters.length, complete };
}

/* ---------------------------- storage hook ---------------------------- */

function useWorkspace() {
  const [workspace, setWorkspace] = useState(null);
  const [status, setStatus] = useState("loading"); // loading | ready
  const saveTimer = useRef(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (!cancelled) {
          if (res && res.value) {
            setWorkspace(JSON.parse(res.value));
          } else {
            setWorkspace(null); // signal: needs onboarding choice
          }
          setStatus("ready");
        }
      } catch (e) {
        if (!cancelled) { setWorkspace(null); setStatus("ready"); }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const persist = useCallback((ws) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try { await window.storage.set(STORAGE_KEY, JSON.stringify(ws), false); } catch (e) { /* noop */ }
    }, 350);
  }, []);

  const update = useCallback((updater) => {
    setWorkspace((prev) => {
      const base = prev || emptyWorkspace();
      const next = typeof updater === "function" ? updater(base) : updater;
      persist(next);
      return next;
    });
  }, [persist]);

  const clearAll = useCallback(async () => {
    const fresh = emptyWorkspace();
    setWorkspace(fresh);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(fresh), false); } catch (e) { /* noop */ }
  }, []);

  return { workspace, status, update, clearAll, setWorkspace, persistNow: persist };
}

function Modal({ open, onClose, title, children, width = "max-w-lg" }) {
  const panelRef = useRef(null);
  const [titleId] = useState(() => `modal-title-${uid("t")}`);

  useEffect(() => {
    if (!open) return;
    function onKey(e) {
      if (e.key === "Escape") { onClose(); return; }
      if (e.key === "Tab" && panelRef.current) {
        const focusables = panelRef.current.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusables.length === 0) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    window.addEventListener("keydown", onKey);
    const t = setTimeout(() => panelRef.current?.focus(), 0);
    return () => { window.removeEventListener("keydown", onKey); clearTimeout(t); };
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" role="dialog" aria-modal="true" aria-labelledby={titleId}>
      <div className="absolute inset-0" style={{ background: "rgba(20,16,12,0.45)" }} onClick={onClose} />
      <div
        ref={panelRef}
        tabIndex={-1}
        className={`relative w-full ${width} sd-card sd-anim rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col outline-none`}
        style={{ background: "var(--bg-surface)" }}
      >

          <h2 id={titleId} className="font-semibold text-base" style={{ color: "var(--text-primary)" }}>{title}</h2>
          <IconBtn icon={X} label="Close" onClick={onClose} />
        </div>
        <div className="px-5 py-4 overflow-y-auto sd-scroll">{children}</div>
      </div>
    </div>
  );
}

   HOME
============================================================================ */

function Home({ ws, update, go, toast }) {
  const stories = ws.stories;
  const allChapters = stories.flatMap((s) => (s.chapters || []).map((c) => ({ ...c, storyId: s.id, storyTitle: s.title })));
  const recent = [...allChapters].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];
  const recentStory = recent ? stories.find((s) => s.id === recent.storyId) : stories[0];

  const today = todayStr();
  const todayWords = Math.max(0, ws.dailyLog[today] || 0);
  const goal = ws.goals.dailyWords;

  const streak = useMemo(() => {
    let n = 0;
    for (let i = 0; ; i++) {
      const d = daysAgoStr(i);
      if ((ws.dailyLog[d] || 0) > 0) n++;
      else break;
    }
    return n;
  }, [ws.dailyLog]);

  const recentIdeas = [...ws.ideas].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 3);
  const hour = new Date().getHours();
  const greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const showReminder = shouldShowBackupReminder(ws);

  function dismissReminder() {
    update((w) => ({ ...w, backupReminderDismissedAt: new Date().toISOString() }));
  }

  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-10 pb-28 md:pb-10 sd-anim">
      <h1 className="text-2xl sm:text-3xl font-semibold mb-6 sd-serif" style={{ color: "var(--text-primary)" }}>{greeting} 👋</h1>

      {showReminder && (
        <div className="sd-card rounded-2xl p-4 mb-5 flex items-start gap-3" style={{ background: "var(--accent-soft)", borderColor: "transparent" }}>
          <Download size={18} className="mt-0.5 shrink-0" style={{ color: "var(--accent)" }} />
          <div className="flex-1 min-w-0">
            <p className="text-sm font-medium" style={{ color: "var(--text-primary)" }}>It's been a while since your last backup</p>
            <p className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>Everything's saved on this device, but exporting a backup now and then protects you if something happens to it.</p>
            <button onClick={() => go("settings")} className="text-xs font-semibold mt-2 sd-focus" style={{ color: "var(--accent)" }}>Go to Settings →</button>
          </div>
          <IconBtn icon={X} label="Dismiss" onClick={dismissReminder} size={15} />
        </div>
      )}

      {recent && recentStory ? (
        <div className="sd-card rounded-2xl p-5 mb-5">
          <p className="text-xs font-medium mb-2" style={{ color: "var(--text-faint)" }}>Continue writing</p>
          <p className="text-lg font-semibold" style={{ color: "var(--text-primary)" }}>{recentStory.title}</p>
          <p className="text-sm mb-3" style={{ color: "var(--text-muted)" }}>
            Chapter {recentStory.chapters.findIndex((c) => c.id === recent.id) + 1} — {recent.title || "Untitled"} · {recent.wordCount || 0} words
          </p>
          <Btn variant="primary" icon={PenLine} onClick={() => go("write", { storyId: recentStory.id, chapterId: recent.id })}>
            Continue Writing
          </Btn>
        </div>
      ) : (
        <EmptyState icon={BookOpen} title="No stories yet" body="Your next story starts here. Create your first story and build it chapter by chapter." actionLabel="Create Story" onAction={() => go("stories", { create: true })} />
      )}

      <div className="grid sm:grid-cols-2 gap-4 mb-5">
        <div className="sd-card rounded-2xl p-5">
          <p className="text-xs font-medium mb-1" style={{ color: "var(--text-faint)" }}>Today's goal</p>
          <p className="text-lg font-semibold mb-3" style={{ color: "var(--text-primary)" }}>{todayWords} / {goal} words</p>
          <ProgressBar value={todayWords} max={goal} />
          <div className="flex items-center justify-between mt-3">
            <span className="text-xs font-medium" style={{ color: "var(--accent)" }}>{pct(todayWords, goal)}%</span>
            <Btn size="sm" variant="secondary" icon={PenLine} onClick={() => go("write")}>Start Writing</Btn>
          </div>
        </div>
        <div className="sd-card rounded-2xl p-5 flex flex-col justify-between">
          <p className="text-xs font-medium mb-1" style={{ color: "var(--text-faint)" }}>Writing streak</p>
          <div className="flex items-center gap-2 my-1">
            <Flame size={22} style={{ color: streak > 0 ? "var(--accent)" : "var(--text-faint)" }} />
            <span className="text-2xl font-semibold" style={{ color: "var(--text-primary)" }}>{streak}</span>
            <span className="text-sm" style={{ color: "var(--text-muted)" }}>day{streak === 1 ? "" : "s"}</span>
          </div>
          <p className="text-xs" style={{ color: "var(--text-faint)" }}>{streak > 0 ? "Keep it going today." : "Write today to start a streak."}</p>
        </div>
      </div>

      {stories.length > 0 && (
        <div className="mb-5">
          <div className="flex items-center justify-between mb-3">
            <h2 className="font-semibold" style={{ color: "var(--text-primary)" }}>Your Stories</h2>
            <button onClick={() => go("stories")} className="text-sm font-medium sd-focus" style={{ color: "var(--accent)" }}>See all</button>
          </div>
          <div className="grid sm:grid-cols-2 gap-4">
            {stories.slice(0, 4).map((s) => <StoryCard key={s.id} story={s} onOpen={() => go("story", { storyId: s.id })} compact />)}
          </div>
        </div>
      )}

      {recentIdeas.length > 0 && (
        <div className="mb-5">
          <div className="flex items-center justify-between mb-3">
            <h2 className="font-semibold" style={{ color: "var(--text-primary)" }}>Recent Ideas</h2>
            <button onClick={() => go("ideas")} className="text-sm font-medium sd-focus" style={{ color: "var(--accent)" }}>See all</button>
          </div>
          <div className="space-y-2">
            {recentIdeas.map((idea) => (
              <div key={idea.id} className="sd-card rounded-xl px-4 py-3 flex items-start gap-3">
                <Lightbulb size={16} className="mt-0.5 shrink-0" style={{ color: "var(--accent)" }} />
                <div className="min-w-0">
                  <p className="text-sm font-medium truncate" style={{ color: "var(--text-primary)" }}>{idea.title}</p>
                  <p className="text-xs truncate" style={{ color: "var(--text-muted)" }}>{idea.content}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function StoryCard({ story, onOpen, onMenu, compact }) {
  const totals = storyTotals(story);
  return (
    <button onClick={onOpen} className="sd-card rounded-2xl p-4 text-left hover:-translate-y-0.5 transition-transform sd-focus w-full">
      <div className="flex gap-3">
        <div className="rounded-xl w-14 h-18 shrink-0 flex items-center justify-center sd-serif font-semibold text-white overflow-hidden" style={{ background: story.coverColor || "var(--accent)", width: 56, height: 74 }}>
          {story.cover ? <img src={story.cover} alt="" className="w-full h-full object-cover" /> : story.title.slice(0, 1).toUpperCase()}
        </div>
        <div className="min-w-0 flex-1">
          <div className="flex items-start justify-between gap-2">
            <p className="font-semibold truncate sd-serif" style={{ color: "var(--text-primary)" }}>{story.title}</p>
            {onMenu && <IconBtn icon={MoreHorizontal} label="Story options" onClick={(e) => { e.stopPropagation(); onMenu(e); }} size={16} />}
          </div>
          <div className="flex items-center gap-1.5 mt-1 flex-wrap">
            <Badge tone={statusTone(story.status)}>{story.status}</Badge>
            <span className="text-xs" style={{ color: "var(--text-faint)" }}>{story.genre}</span>
          </div>
          <p className="text-xs mt-2" style={{ color: "var(--text-muted)" }}>
            {totals.chapters} chapter{totals.chapters === 1 ? "" : "s"} · {totals.words.toLocaleString()} words
          </p>
        </div>
      </div>
      {!compact && (
        <div className="mt-3">
          <ProgressBar value={totals.words} max={story.targetWords || 1} height={6} />
          <div className="flex items-center justify-between mt-1.5">
            <span className="text-xs" style={{ color: "var(--text-faint)" }}>{pct(totals.words, story.targetWords || 1)}% complete</span>
            <span className="text-xs" style={{ color: "var(--text-faint)" }}>Updated {timeAgo(story.updatedAt)}</span>
          </div>
        </div>
      )}
    </button>
  );
}

function StoryFormModal({ open, onClose, onSave, initial }) {
  const blank = { title: "", description: "", genre: "Romance", status: "Idea", targetChapters: 20, targetWords: 30000, cover: null, wattpadUrl: "" };
  const [form, setForm] = useState(initial || blank);
  const [coverWarning, setCoverWarning] = useState("");
  const [coverBusy, setCoverBusy] = useState(false);
  useEffect(() => { if (open) { setForm(initial || blank); setCoverWarning(""); } }, [open, initial]);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const canSave = form.title && form.title.trim().length > 0;

  async function onCoverFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setCoverBusy(true);
    setCoverWarning("");
    try {
      const { dataUrl, wattpadReady } = await resizeImageFile(file);
      setForm((f) => ({ ...f, cover: dataUrl }));
      if (!wattpadReady) setCoverWarning("This image isn't close to Wattpad's recommended cover ratio (about 512×800) — it'll still work, just may crop oddly there.");
    } catch (err) {
      setCoverWarning("Couldn't read that image — try a different file.");
    }
    setCoverBusy(false);
    e.target.value = "";
  }

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Story" : "New Story"}>
      <Field label="Cover" hint={coverWarning || "Optional — used on your story card and in EPUB/print exports."}>
        <div className="flex items-center gap-3">
          {form.cover ? (
            <img src={form.cover} alt="" className="w-14 h-20 object-cover rounded-lg" style={{ border: "1px solid var(--border)" }} />
          ) : (
            <div className="w-14 h-20 rounded-lg flex items-center justify-center" style={{ background: "var(--bg-sunken)" }}>
              <ImagePlus size={18} style={{ color: "var(--text-faint)" }} />
            </div>
          )}
          <div className="flex flex-col gap-1.5">
            <label className="text-xs font-medium px-3 py-1.5 rounded-lg cursor-pointer sd-focus" style={{ background: "var(--bg-sunken)", color: "var(--text-primary)" }}>
              {coverBusy ? "Reading..." : "Upload image"}
              <input type="file" accept="image/*" className="hidden" onChange={onCoverFile} disabled={coverBusy} />
            </label>
            {form.cover && <button type="button" onClick={() => setForm((f) => ({ ...f, cover: null }))} className="text-xs sd-focus" style={{ color: "var(--danger)" }}>Remove cover</button>}
          </div>
        </div>
      </Field>
      <Field label="Story title">
        <TextInput value={form.title} onChange={set("title")} placeholder="e.g. My First Love" autoFocus />
      </Field>
      <Field label="Short description" hint="Optional — a line or two about the story.">
        <TextArea rows={3} value={form.description} onChange={set("description")} placeholder="What's this story about?" />
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Genre">
          <Select value={form.genre} onChange={set("genre")}>
            {GENRES.map((g) => <option key={g} value={g}>{g}</option>)}
          </Select>
        </Field>
        <Field label="Status">
          <Select value={form.status} onChange={set("status")}>
            {STORY_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
          </Select>
        </Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Target chapters">
          <TextInput type="number" min={0} value={form.targetChapters} onChange={set("targetChapters")} />
        </Field>
        <Field label="Target words">
          <TextInput type="number" min={0} value={form.targetWords} onChange={set("targetWords")} />
        </Field>
      </div>
      <Field label="Wattpad story URL" hint="Optional — lets you jump straight to this story on Wattpad.">
        <TextInput value={form.wattpadUrl || ""} onChange={set("wattpadUrl")} placeholder="https://www.wattpad.com/story/..." />
      </Field>
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" disabled={!canSave} onClick={() => onSave(form)}>{initial ? "Save Changes" : "Create Story"}</Btn>
      </div>
    </Modal>
  );
}

function Stories({ ws, update, go, toast, initialCreate }) {
  const [layout, setLayout] = useState("grid");
  const [showForm, setShowForm] = useState(!!initialCreate);
  const [editing, setEditing] = useState(null);
  const [menuFor, setMenuFor] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [filter, setFilter] = useState("All");
  useEffect(() => { if (initialCreate) setShowForm(true); }, [initialCreate]);

  const filtered = filter === "All" ? ws.stories : ws.stories.filter((s) => s.status === filter);

  function createStory(form) {
    const now = new Date().toISOString();
    const palette = ["#7A3B32", "#3B5A6B", "#5B4B7A", "#4C7A5B", "#7A6B3B"];
    const story = {
      id: uid("story"), title: form.title.trim(), description: form.description || "", genre: form.genre,
      status: form.status, cover: form.cover || null, coverColor: palette[ws.stories.length % palette.length],
      targetChapters: Number(form.targetChapters) || 20, targetWords: Number(form.targetWords) || 30000,
      wattpadUrl: form.wattpadUrl || "", wattpadStats: [], research: [],
      chapters: [], notes: "", createdAt: now, updatedAt: now,
    };
    update((w) => ({ ...w, stories: [story, ...w.stories] }));
    setShowForm(false);
    toast("Story created");
    go("story", { storyId: story.id });
  }
  function saveEdit(form) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === editing.id ? { ...s, ...form, targetChapters: Number(form.targetChapters), targetWords: Number(form.targetWords), updatedAt: new Date().toISOString() } : s) }));
    setEditing(null);
    toast("Story updated");
  }
  function duplicateStory(s) {
    const copy = { ...s, id: uid("story"), title: `${s.title} (Copy)`, chapters: s.chapters.map((c) => ({ ...c, id: uid("chap") })), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    update((w) => ({ ...w, stories: [copy, ...w.stories] }));
    toast("Story duplicated");
  }
  function archiveStory(s) {
    update((w) => ({ ...w, stories: w.stories.map((x) => x.id === s.id ? { ...x, status: "Completed", archived: !x.archived } : x) }));
    toast(s.archived ? "Story unarchived" : "Story archived");
  }
  function deleteStory(s) {
    update((w) => ({ ...w, stories: w.stories.filter((x) => x.id !== s.id) }));
    setConfirmDelete(null);
    toast("Story deleted");
  }

  return (
    <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10 pb-28 md:pb-10 sd-anim">
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <h1 className="text-2xl font-semibold sd-serif" style={{ color: "var(--text-primary)" }}>Your Stories</h1>
        <div className="flex items-center gap-2">
          <div className="flex items-center rounded-lg p-0.5" style={{ background: "var(--bg-sunken)" }}>
            <IconBtn icon={Grid3x3} label="Grid view" onClick={() => setLayout("grid")} variant={layout === "grid" ? "solid" : "ghost"} />
            <IconBtn icon={List} label="List view" onClick={() => setLayout("list")} variant={layout === "list" ? "solid" : "ghost"} />
          </div>
          <Btn variant="primary" icon={Plus} onClick={() => setShowForm(true)}>New Story</Btn>
        </div>
      </div>

      <div className="flex gap-2 mb-5 overflow-x-auto sd-scroll pb-1">
        {["All", ...STORY_STATUSES].map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className="px-3 py-1.5 rounded-full text-sm font-medium whitespace-nowrap sd-focus"
            style={{ background: filter === f ? "var(--accent)" : "var(--bg-surface)", color: filter === f ? "var(--accent-contrast)" : "var(--text-muted)", border: filter === f ? "none" : "1px solid var(--border)" }}
          >
            {f}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <EmptyState icon={BookOpen} title="No stories yet" body="Your next story starts here. Create your first story and build it chapter by chapter." actionLabel="Create Story" onAction={() => setShowForm(true)} />
      ) : (
        <div className={layout === "grid" ? "grid sm:grid-cols-2 lg:grid-cols-3 gap-4" : "space-y-3"}>
          {filtered.map((s) => (
            <div key={s.id} className="relative">
              <StoryCard story={s} onOpen={() => go("story", { storyId: s.id })} onMenu={() => setMenuFor(menuFor === s.id ? null : s.id)} />
              {menuFor === s.id && (
                <div className="absolute right-3 top-14 z-20 sd-card rounded-xl py-1 w-44 sd-anim" style={{ background: "var(--bg-surface)" }}>
                  {[
                    { label: "Edit", icon: Edit3, action: () => { setEditing(s); setMenuFor(null); } },
                    { label: "Duplicate", icon: Copy, action: () => { duplicateStory(s); setMenuFor(null); } },
                    { label: s.archived ? "Unarchive" : "Archive", icon: Archive, action: () => { archiveStory(s); setMenuFor(null); } },
                    { label: "Delete", icon: Trash2, action: () => { setConfirmDelete(s); setMenuFor(null); }, danger: true },
                  ].map((item) => (
                    <button key={item.label} onClick={item.action} className="w-full flex items-center gap-2 px-3 py-2 text-sm hover:opacity-80 sd-focus" style={{ color: item.danger ? "var(--danger)" : "var(--text-primary)" }}>
                      <item.icon size={15} /> {item.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      <StoryFormModal open={showForm} onClose={() => setShowForm(false)} onSave={createStory} />
      <StoryFormModal open={!!editing} onClose={() => setEditing(null)} onSave={saveEdit} initial={editing} />
      <ConfirmDialog
        open={!!confirmDelete}
        onClose={() => setConfirmDelete(null)}
        onConfirm={() => deleteStory(confirmDelete)}
        title="Delete this story?"

  );
}

/* ---- touch-friendly drag reorder (Phase 2) ---- */

// Works uniformly for mouse + touch via Pointer Events. `onMove` is called
// continuously with (draggedId, clientX, clientY) while dragging; callers use
// document.elementFromPoint to figure out what's under the pointer and decide
// how to reorder/reassign. A non-drag fallback (menus/buttons) is provided
// alongside every use of this hook, so nothing depends on drag working.
function usePointerDrag(onMove, onEnd) {
  const [draggingId, setDraggingId] = useState(null);
  const onMoveRef = useRef(onMove);
  const onEndRef = useRef(onEnd);
  useEffect(() => { onMoveRef.current = onMove; }, [onMove]);
  useEffect(() => { onEndRef.current = onEnd; }, [onEnd]);

  useEffect(() => {
    if (!draggingId) return;
    function handleMove(e) {
      const p = e.touches ? e.touches[0] : e;
      if (p) onMoveRef.current(draggingId, p.clientX, p.clientY);
    }
    function handleEnd() { setDraggingId(null); onEndRef.current && onEndRef.current(draggingId); }
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleEnd);
    window.addEventListener("pointercancel", handleEnd);
    return () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleEnd);
      window.removeEventListener("pointercancel", handleEnd);
    };
  }, [draggingId]);
  return { draggingId, start: setDraggingId };
}

function PlanBoard({ story, onUpdateChapters, onOpenChapter, characters, tagFilter }) {
  const [menuFor, setMenuFor] = useState(null);
  const chapters = story.chapters;

  function moveToStatus(chapterId, status) {
    const moved = chapters.find((c) => c.id === chapterId);
    if (!moved || moved.status === status) return;
    const others = chapters.filter((c) => c.id !== chapterId);
    onUpdateChapters([...others, { ...moved, status, updatedAt: new Date().toISOString() }]);
  }

  const drag = usePointerDrag((id, x, y) => {
    const el = document.elementFromPoint(x, y);
    const cardEl = el && el.closest("[data-plan-card]");
    const colEl = el && el.closest("[data-plan-column]");
    const targetStatus = cardEl ? cardEl.getAttribute("data-plan-status") : (colEl ? colEl.getAttribute("data-plan-column") : null);
    if (!targetStatus) return;
    const dragged = chapters.find((c) => c.id === id);
    if (!dragged) return;
    if (dragged.status === targetStatus && (!cardEl || cardEl.getAttribute("data-plan-card") === id)) return;
    const rest = chapters.filter((c) => c.id !== id);
    const updatedDragged = { ...dragged, status: targetStatus, updatedAt: new Date().toISOString() };
    let next;
    if (cardEl && cardEl.getAttribute("data-plan-card") !== id) {
      const overId = cardEl.getAttribute("data-plan-card");
      const overIndex = rest.findIndex((c) => c.id === overId);
      next = [...rest];
      next.splice(overIndex === -1 ? next.length : overIndex, 0, updatedDragged);
    } else {
      next = [...rest, updatedDragged];
    }
    onUpdateChapters(next);
  });

  return (
    <div className="flex gap-4 overflow-x-auto sd-scroll pb-4 -mx-4 px-4 sm:mx-0 sm:px-0">
      {CHAPTER_STATUSES.map((status) => {
        const cards = chapters.filter((c) => c.status === status && (!tagFilter || (c.tags || []).includes(tagFilter)));
        return (
          <div
            key={status}
            data-plan-column={status}
            className="w-64 shrink-0 rounded-2xl p-3 sd-focus transition-colors"
            style={{ background: drag.draggingId ? "var(--accent-soft)" : "var(--bg-surface-2)", border: "1px solid var(--border)" }}
          >
            <div className="flex items-center justify-between px-1 mb-2">
              <span className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>{status}</span>
              <span className="text-xs rounded-full px-2 py-0.5" style={{ background: "var(--bg-sunken)", color: "var(--text-faint)" }}>{cards.length}</span>
            </div>
            <div className="space-y-2 min-h-[60px]">
              {cards.map((c) => (
                <div
                  key={c.id}
                  data-plan-card={c.id}
                  data-plan-status={status}
                  onClick={() => onOpenChapter(c)}
                  className="sd-card rounded-xl p-3 cursor-pointer relative"
                  style={{ opacity: drag.draggingId === c.id ? 0.4 : 1 }}
                >
                  <div className="flex items-start justify-between gap-1 mb-1">
                    <p className="text-sm font-medium" style={{ color: "var(--text-primary)" }}>{c.title || "Untitled"}</p>
                    <div className="flex items-center gap-0.5 shrink-0">
                      <div
                        className="cursor-grab active:cursor-grabbing p-1 touch-none"
                        style={{ color: "var(--text-faint)" }}
                        onPointerDown={(e) => { e.stopPropagation(); drag.start(c.id); }}
                      >
                        <GripVertical size={13} />
                      </div>
                      <div className="relative">
                        <IconBtn icon={MoreHorizontal} label="Move to..." size={13} onClick={(e) => { e.stopPropagation(); setMenuFor(menuFor === c.id ? null : c.id); }} />
                        <DropdownMenu
                          open={menuFor === c.id}
                          onClose={() => setMenuFor(null)}
                          items={CHAPTER_STATUSES.filter((s) => s !== status).map((s) => ({ label: `Move to ${s}`, onClick: () => moveToStatus(c.id, s) }))}
                        />
                      </div>
                    </div>
                  </div>
                  {c.summary && <p className="text-xs mb-2 line-clamp-2" style={{ color: "var(--text-muted)" }}>{c.summary}</p>}
                  <TagChips tags={c.tags} />
                  <div className="flex items-center justify-between mt-1.5">
                    <span className="text-xs" style={{ color: "var(--text-faint)" }}>{c.wordCount || 0}w</span>
                    {c.location && <span className="text-xs truncate max-w-[100px]" style={{ color: "var(--text-faint)" }}>{c.location}</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ChaptersTabList({ story, visibleChapters, allTags, tagFilter, setTagFilter, onAddChapter, onOpen, onEdit, onDelete, onDuplicate, onMove, reorder }) {
  const drag = usePointerDrag((id, x, y) => {
    const el = document.elementFromPoint(x, y);
    const rowEl = el && el.closest("[data-chapter-row]");
    if (!rowEl) return;
    const overId = rowEl.getAttribute("data-chapter-row");
    if (overId === id) return;
    const fromIndex = story.chapters.findIndex((c) => c.id === id);
    const toIndex = story.chapters.findIndex((c) => c.id === overId);
    if (fromIndex === -1 || toIndex === -1 || fromIndex === toIndex) return;
    reorder(fromIndex, toIndex);
  });

  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-1 flex-wrap">
        <div className="flex-1 min-w-[140px]"><TagFilterBar allTags={allTags} active={tagFilter} onChange={setTagFilter} /></div>
        <Btn variant="primary" size="sm" icon={Plus} onClick={onAddChapter}>New Chapter</Btn>

      {visibleChapters.length === 0 ? (
        <EmptyState
          icon={FileText}
          title={tagFilter ? "No chapters with this tag" : "No chapters yet"}
          body={tagFilter ? "Try a different tag, or tap \"All\" above to clear the filter." : "Break your story into chapters to start writing."}
          actionLabel={tagFilter ? undefined : "Add Chapter"}
          onAction={tagFilter ? undefined : onAddChapter}
        />
      ) : (
        <div className="space-y-2 mt-2">
          {visibleChapters.map((c) => {
            const index = story.chapters.findIndex((x) => x.id === c.id);
            return (
              <div key={c.id} data-chapter-row={c.id}>
                <ChapterRow
                  chapter={c}
                  index={index}
                  total={story.chapters.length}
                  onOpen={() => onOpen(c)}
                  onEdit={() => onEdit(c)}
                  onDelete={() => onDelete(c)}
                  onDuplicate={() => onDuplicate(c)}
                  onDragHandlePointerDown={() => drag.start(c.id)}
                  isDragging={drag.draggingId === c.id}
                  onMoveUp={() => onMove(c.id, "up")}
                  onMoveDown={() => onMove(c.id, "down")}
                  onMoveTop={() => onMove(c.id, "top")}
                  onMoveBottom={() => onMove(c.id, "bottom")}
                />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function publishDateStatus(dateStr) {
  if (!dateStr) return null;
  const days = Math.ceil((new Date(dateStr) - new Date(new Date().toDateString())) / 86400000);
  if (days < 0) return { label: `${Math.abs(days)}d overdue`, tone: "danger" };
  if (days === 0) return { label: "Today", tone: "accent" };
  if (days <= 7) return { label: `${days}d left`, tone: "accent" };
  return { label: `${days}d left`, tone: "neutral" };
}

          <Btn size="sm" variant="secondary" icon={Plus} onClick={onAddStat}>Add Snapshot</Btn>
        </div>
        {history.length === 0 ? (
          <p className="text-xs" style={{ color: "var(--text-faint)" }}>No snapshots yet — add reads/votes/comments from your Wattpad page whenever you check in.</p>

              <div key={h.id} className="flex items-center justify-between text-xs px-2.5 py-2 rounded-lg" style={{ background: "var(--bg-surface-2)" }}>

                <span style={{ color: "var(--text-faint)" }}>{h.votes.toLocaleString()} votes</span>
                <span style={{ color: "var(--text-faint)" }}>{h.comments.toLocaleString()} comments</span>
                <IconBtn icon={X} label="Delete snapshot" size={13} onClick={() => onDeleteStat(h.id)} />

        <div className="sd-card rounded-2xl p-4">

            {story.chapters.map((c) => (
              <div key={c.id} className="flex items-center gap-2 text-xs">
                <span className="flex-1 min-w-0 truncate" style={{ color: "var(--text-primary)" }}>{c.title || "Untitled"}</span>
                <input type="number" min={0} defaultValue={c.reads || 0} onBlur={(e) => onSetChapterField(c.id, "reads", Number(e.target.value) || 0)} placeholder="Reads" className="w-16 px-1.5 py-1 rounded text-right" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", color: "var(--text-primary)" }} />
                <input type="number" min={0} defaultValue={c.votes || 0} onBlur={(e) => onSetChapterField(c.id, "votes", Number(e.target.value) || 0)} placeholder="Votes" className="w-16 px-1.5 py-1 rounded text-right" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", color: "var(--text-primary)" }} />
                <input type="number" min={0} defaultValue={c.comments || 0} onBlur={(e) => onSetChapterField(c.id, "comments", Number(e.target.value) || 0)} placeholder="Comments" className="w-16 px-1.5 py-1 rounded text-right" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", color: "var(--text-primary)" }} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PublishPackModal({ open, onClose, story, chapter, onChangeChapter, onSetAuthorNote, toast }) {
  const [noteDraft, setNoteDraft] = useState(chapter?.authorNote || "");
  useEffect(() => { setNoteDraft(chapter?.authorNote || ""); }, [chapter?.id]);
  if (!open || !story) return null;
  const chapterText = chapter ? htmlToWattpadText(normalizeChapterHtml(chapter.content)) : "";
  const tagsText = Array.from(new Set((story.chapters.flatMap((c) => c.tags || [])))).join(", ");

  async function copy(text, label) {
    try { await navigator.clipboard.writeText(text); toast(`${label} copied`); } catch (e) { toast("Couldn't copy"); }
  }
  async function copyAll() {
    const all = `${chapter?.title || ""}\n\n${chapterText}${noteDraft ? `\n\n---\nAuthor's Note:\n${noteDraft}` : ""}`;
    await copy(all, "Everything");
  }

  return (
    <Modal open={open} onClose={onClose} title="Publish Pack" width="max-w-xl">
      <Field label="Chapter">
        <Select value={chapter?.id || ""} onChange={(e) => onChangeChapter(e.target.value)}>
          {story.chapters.map((c) => <option key={c.id} value={c.id}>{c.title || "Untitled"}</option>)}
        </Select>
      </Field>
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-sm font-medium" style={{ color: "var(--text-primary)" }}>{chapter?.title || "Untitled"}</span>
        <button onClick={() => copy(chapter?.title || "", "Title")} className="text-xs font-medium sd-focus" style={{ color: "var(--accent)" }}>Copy Title</button>
      </div>
      <div className="rounded-xl p-3 mb-3 max-h-40 overflow-y-auto sd-scroll text-sm" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", color: "var(--text-primary)", whiteSpace: "pre-wrap" }}>
        {chapterText || "This chapter has no content yet."}
      </div>
      <div className="flex justify-end mb-4">
        <button onClick={() => copy(chapterText, "Chapter")} className="text-xs font-medium sd-focus" style={{ color: "var(--accent)" }}>Copy Chapter Text</button>
      </div>

      <Field label="Author's Note" hint="Optional — shown after the chapter when copied.">
        <TextArea rows={3} value={noteDraft} onChange={(e) => setNoteDraft(e.target.value)} onBlur={() => onSetAuthorNote(noteDraft)} placeholder="Thanks for reading! Vote and comment..." />
      </Field>

      <Field label="Story description">
        <div className="flex items-start gap-2">
          <p className="flex-1 text-sm rounded-xl p-3" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", color: "var(--text-primary)" }}>{story.description || "No description set."}</p>
          <button onClick={() => copy(story.description || "", "Description")} className="text-xs font-medium shrink-0 sd-focus" style={{ color: "var(--accent)" }}>Copy</button>
        </div>
      </Field>

      <Field label="Tags" hint="Collected from all chapter tags in this story.">
        <div className="flex items-start gap-2">
          <p className="flex-1 text-sm rounded-xl p-3" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)", color: "var(--text-primary)" }}>{tagsText || "No tags yet."}</p>
          <button onClick={() => copy(tagsText, "Tags")} className="text-xs font-medium shrink-0 sd-focus" style={{ color: "var(--accent)" }}>Copy</button>
        </div>
      </Field>

      <div className="flex flex-wrap justify-end gap-2 mt-2">
        {story.wattpadUrl && <a href={story.wattpadUrl} target="_blank" rel="noopener noreferrer"><Btn variant="secondary" icon={Link2}>Open Wattpad</Btn></a>}
        <Btn variant="primary" icon={Copy} onClick={copyAll}>Copy All</Btn>
      </div>
    </Modal>
  );
}

const RESEARCH_CATEGORIES = ["Link", "Note", "Quote", "Reference", "Other"];

function ResearchFormModal({ open, onClose, onSave, initial }) {
  const blank = { title: "", content: "", category: "Note", url: "", tags: "" };
  const [form, setForm] = useState(initial ? { ...initial, tags: (initial.tags || []).join(", ") } : blank);
  useEffect(() => { if (open) setForm(initial ? { ...initial, tags: (initial.tags || []).join(", ") } : blank); }, [open, initial]);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Research Item" : "New Research Item"}>
      <Field label="Title"><TextInput value={form.title} onChange={set("title")} autoFocus placeholder="e.g. Victorian mourning customs" /></Field>
      <Field label="Details"><TextArea rows={3} value={form.content} onChange={set("content")} placeholder="Notes, a quote, a summary..." /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Category">
          <Select value={form.category} onChange={set("category")}>{RESEARCH_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}</Select>
        </Field>
        <Field label="Link" hint="Optional"><TextInput value={form.url} onChange={set("url")} placeholder="https://..." /></Field>
      </div>
      <Field label="Tags" hint="Comma-separated"><TextInput value={form.tags} onChange={set("tags")} placeholder="worldbuilding, historical" /></Field>
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" disabled={!form.title.trim()} onClick={() => onSave({ ...form, tags: form.tags.split(",").map((t) => t.trim()).filter(Boolean) })}>{initial ? "Save Changes" : "Add Item"}</Btn>
      </div>
    </Modal>
  );
}

function StoryDetail({ ws, update, storyId, go, toast, subtab, setSubtab }) {
  const story = ws.stories.find((s) => s.id === storyId);
  const [showChapterForm, setShowChapterForm] = useState(false);
  const [editingChapter, setEditingChapter] = useState(null);
  const [confirmDeleteChapter, setConfirmDeleteChapter] = useState(null);
  const [tagFilter, setTagFilter] = useState(null);
  const [charView, setCharView] = useState("grid");
  const [showPublishPack, setShowPublishPack] = useState(false);
  const [publishPackChapterId, setPublishPackChapterId] = useState(null);
  const [showStatForm, setShowStatForm] = useState(false);
  const [confirmDeleteStat, setConfirmDeleteStat] = useState(null);
  const [showResearchForm, setShowResearchForm] = useState(false);
  const [editingResearch, setEditingResearch] = useState(null);
  const [confirmDeleteResearch, setConfirmDeleteResearch] = useState(null);

  if (!story) return (
    <div className="max-w-3xl mx-auto px-6 py-16">
      <EmptyState icon={BookOpen} title="Story not found" body="This story may have been deleted." actionLabel="Back to Stories" onAction={() => go("stories")} />
    </div>
  );

  const totals = storyTotals(story);
  const storyCharacters = (ws.characters || []).filter((c) => c.storyIds?.includes(storyId));
  const storyIdeas = ws.ideas.filter((i) => i.storyId === storyId);
  const allTags = Array.from(new Set(story.chapters.flatMap((c) => c.tags || [])));
  const visibleChapters = tagFilter ? story.chapters.filter((c) => (c.tags || []).includes(tagFilter)) : story.chapters;

  function setChapters(chapters) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, chapters, updatedAt: new Date().toISOString() } : s) }));
  }
  function addChapter(form) {
    const now = new Date().toISOString();
    const chapter = {
      id: uid("chap"), order: story.chapters.length, title: form.title.trim(), content: "", status: form.status,
      summary: form.summary || "", location: form.location || "", targetWords: Number(form.targetWords) || 1500,
      linkedCharacterIds: form.linkedCharacterIds || [], tags: form.tags || [], wordCount: 0,
      storyTimeOrder: story.chapters.length, storyTimeLabel: "", targetPublishDate: "",
      authorNote: "", reads: 0, votes: 0, comments: 0,
      versions: [], lastCursorOffset: 0,
      createdAt: now, updatedAt: now,
    };
    setChapters([...story.chapters, chapter]);
    setShowChapterForm(false);
    toast("Chapter added");
  }
  function setChapterField(id, field, value) {
    setChapters(story.chapters.map((c) => c.id === id ? { ...c, [field]: value, updatedAt: new Date().toISOString() } : c));
  }
  function saveChapterEdit(form) {
    setChapters(story.chapters.map((c) => c.id === editingChapter.id ? { ...c, ...form, targetWords: Number(form.targetWords), updatedAt: new Date().toISOString() } : c));
    setEditingChapter(null);
    toast("Chapter updated");
  }
  function deleteChapter(c) {
    setChapters(story.chapters.filter((x) => x.id !== c.id));
    setConfirmDeleteChapter(null);
    toast("Chapter deleted");
  }
  function duplicateChapter(c) {
    setChapters([...story.chapters, { ...c, id: uid("chap"), title: `${c.title} (Copy)`, versions: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }]);
    toast("Chapter duplicated");
  }
  function reorder(from, to) {
    const arr = [...story.chapters];
    const [moved] = arr.splice(from, 1);
    arr.splice(to, 0, moved);
    setChapters(arr);
  }
  function moveChapter(id, direction) {
    const idx = story.chapters.findIndex((c) => c.id === id);
    if (idx === -1) return;
    let to = idx;
    if (direction === "up") to = Math.max(0, idx - 1);
    else if (direction === "down") to = Math.min(story.chapters.length - 1, idx + 1);
    else if (direction === "top") to = 0;
    else if (direction === "bottom") to = story.chapters.length - 1;
    if (to !== idx) reorder(idx, to);
  }
  function reorderTimeline(fromId, toId) {
    const sorted = [...story.chapters].sort((a, b) => (a.storyTimeOrder ?? 0) - (b.storyTimeOrder ?? 0));
    const fromIdx = sorted.findIndex((c) => c.id === fromId);
    const toIdx = sorted.findIndex((c) => c.id === toId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    const [moved] = sorted.splice(fromIdx, 1);
    sorted.splice(toIdx, 0, moved);
    const orderById = {};
    sorted.forEach((c, i) => { orderById[c.id] = i; });
    setChapters(story.chapters.map((c) => ({ ...c, storyTimeOrder: orderById[c.id] })));
  }
  function setTimelineLabel(id, label) {
    setChapters(story.chapters.map((c) => c.id === id ? { ...c, storyTimeLabel: label } : c));
  }
  function saveNotes(notes) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, notes, updatedAt: new Date().toISOString() } : s) }));
  }
  function setWattpadUrl(url) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, wattpadUrl: url, updatedAt: new Date().toISOString() } : s) }));
  }
  function addWattpadStat(entry) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, wattpadStats: [...(s.wattpadStats || []), { id: uid("stat"), ...entry }], updatedAt: new Date().toISOString() } : s) }));
    toast("Snapshot added");
  }
  function deleteWattpadStat(id) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, wattpadStats: (s.wattpadStats || []).filter((x) => x.id !== id) } : s) }));
  }
  function addResearchItem(item) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, research: [{ id: uid("res"), ...item, createdAt: new Date().toISOString() }, ...(s.research || [])] } : s) }));
    toast("Research item saved");
  }
  function updateResearchItem(id, item) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, research: (s.research || []).map((r) => r.id === id ? { ...r, ...item } : r) } : s) }));
    toast("Research item updated");
  }
  function deleteResearchItem(id) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === storyId ? { ...s, research: (s.research || []).filter((r) => r.id !== id) } : s) }));
    toast("Research item deleted");
  }

  const tabs = [
    { id: "overview", label: "Overview" },
    { id: "chapters", label: "Chapters" },
    { id: "plan", label: "Plan" },
    { id: "timeline", label: "Timeline" },
    { id: "characters", label: "Characters" },
    { id: "wattpad", label: "Wattpad" },
    { id: "research", label: "Research" },
    { id: "notes", label: "Notes" },
  ];

  return (
    <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10 pb-28 md:pb-10 sd-anim">
      <button onClick={() => go("stories")} className="flex items-center gap-1.5 text-sm mb-4 sd-focus" style={{ color: "var(--text-muted)" }}>
        <ArrowLeft size={15} /> Stories
      </button>

      <div className="flex items-start justify-between gap-4 mb-2 flex-wrap">
        <div>
          <h1 className="text-2xl sm:text-3xl font-semibold sd-serif" style={{ color: "var(--text-primary)" }}>{story.title}</h1>
          <div className="flex items-center gap-2 mt-2 flex-wrap">
            <Badge tone={statusTone(story.status)}>{story.status}</Badge>
            <span className="text-sm" style={{ color: "var(--text-faint)" }}>{story.genre}</span>
          </div>
        </div>
        <Btn variant="primary" icon={PenLine} onClick={() => go("write", { storyId })}>Write</Btn>
      </div>
      {story.description && <p className="text-sm mt-3 max-w-2xl" style={{ color: "var(--text-muted)" }}>{story.description}</p>}

      <div className="flex gap-1 mt-6 mb-5 border-b overflow-x-auto sd-scroll" style={{ borderColor: "var(--border)" }}>
        {tabs.map((t) => (
          <button key={t.id} onClick={() => setSubtab(t.id)} className="px-3.5 py-2.5 text-sm font-medium relative whitespace-nowrap sd-focus" style={{ color: subtab === t.id ? "var(--accent)" : "var(--text-muted)" }}>
            {t.label}
            {subtab === t.id && <span className="absolute bottom-[-1px] left-0 right-0 h-0.5 rounded-full" style={{ background: "var(--accent)" }} />}
          </button>
        ))}
      </div>

      {subtab === "overview" && (
        <div className="grid sm:grid-cols-2 gap-4">
          <div className="sd-card rounded-2xl p-5">
            <p className="text-xs font-medium mb-1" style={{ color: "var(--text-faint)" }}>Total words</p>
            <p className="text-2xl font-semibold sd-serif" style={{ color: "var(--text-primary)" }}>{totals.words.toLocaleString()}</p>
            <div className="mt-3"><ProgressBar value={totals.words} max={story.targetWords || 1} height={6} /></div>
            <p className="text-xs mt-1.5" style={{ color: "var(--text-faint)" }}>Goal: {story.targetWords.toLocaleString()} words</p>
          </div>
          <div className="sd-card rounded-2xl p-5">
            <p className="text-xs font-medium mb-1" style={{ color: "var(--text-faint)" }}>Chapters</p>
            <p className="text-2xl font-semibold sd-serif" style={{ color: "var(--text-primary)" }}>{totals.chapters} / {story.targetChapters}</p>
            <p className="text-xs mt-1.5" style={{ color: "var(--text-faint)" }}>{totals.complete} marked complete</p>
          </div>
          <div className="sd-card rounded-2xl p-5">
            <p className="text-xs font-medium mb-2" style={{ color: "var(--text-faint)" }}>Recent activity</p>
            <div className="space-y-2">
              {[...story.chapters].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, 3).map((c) => (
                <div key={c.id} className="flex items-center justify-between text-sm">
                  <span className="truncate" style={{ color: "var(--text-primary)" }}>{c.title || "Untitled"}</span>
                  <span className="text-xs shrink-0 ml-2" style={{ color: "var(--text-faint)" }}>{timeAgo(c.updatedAt)}</span>
                </div>
              ))}
              {story.chapters.length === 0 && <p className="text-xs" style={{ color: "var(--text-faint)" }}>No chapters yet.</p>}
            </div>
          </div>
          <div className="sd-card rounded-2xl p-5">
            <p className="text-xs font-medium mb-2" style={{ color: "var(--text-faint)" }}>Linked ideas</p>
            <p className="text-2xl font-semibold sd-serif" style={{ color: "var(--text-primary)" }}>{storyIdeas.length}</p>
            <button onClick={() => go("ideas")} className="text-xs font-medium mt-1.5 sd-focus" style={{ color: "var(--accent)" }}>View in Ideas Vault</button>
          </div>
        </div>
      )}

      {subtab === "chapters" && (
        <ChaptersTabList
          story={story}
          visibleChapters={visibleChapters}
          allTags={allTags}
          tagFilter={tagFilter}
          setTagFilter={setTagFilter}
          onAddChapter={() => setShowChapterForm(true)}
          onOpen={(c) => go("write", { storyId, chapterId: c.id })}
          onEdit={setEditingChapter}
          onDelete={setConfirmDeleteChapter}
          onDuplicate={duplicateChapter}
          onMove={moveChapter}
          reorder={reorder}
        />
      )}

      {subtab === "plan" && (
        story.chapters.length === 0
          ? <EmptyState icon={LayoutGrid} title="Nothing to plan yet" body="Add a few chapters first, then drag them across stages here." actionLabel="Add Chapter" onAction={() => setShowChapterForm(true)} />
          : (
            <div>
              <TagFilterBar allTags={allTags} active={tagFilter} onChange={setTagFilter} />
              <PlanBoard story={story} onUpdateChapters={setChapters} onOpenChapter={(c) => setEditingChapter(c)} characters={storyCharacters} tagFilter={tagFilter} />
            </div>
          )
      )}

      {subtab === "timeline" && (
        story.chapters.length === 0
          ? <EmptyState icon={GripVertical} title="Nothing to sequence yet" body="Add a few chapters first, then arrange them here by when they happen in the story — separate from publish order." actionLabel="Add Chapter" onAction={() => setShowChapterForm(true)} />
          : <TimelineView story={story} onReorder={reorderTimeline} onLabelChange={setTimelineLabel} onPublishDateChange={(id, date) => setChapterField(id, "targetPublishDate", date)} onOpen={(c) => go("write", { storyId, chapterId: c.id })} />
      )}

      {subtab === "characters" && (
        <div>
          <div className="flex items-center justify-between mb-3 gap-2">
            {storyCharacters.length > 1 ? (
              <div className="flex items-center rounded-lg p-0.5" style={{ background: "var(--bg-sunken)" }}>

                <button onClick={() => setCharView("map")} className="px-2.5 py-1.5 rounded-md text-xs font-medium sd-focus" style={{ background: charView === "map" ? "var(--bg-surface)" : "transparent", color: charView === "map" ? "var(--text-primary)" : "var(--text-faint)" }}>Map</button>
              </div>
            ) : <div />}
            <Btn variant="primary" size="sm" icon={Plus} onClick={() => go("characters", { create: true, storyId })}>New Character</Btn>
          </div>
          {storyCharacters.length === 0 ? (
            <EmptyState icon={Users} title="No characters linked" body="Create characters and link them to this story to keep track of your cast." actionLabel="Add Character" onAction={() => go("characters", { create: true, storyId })} />
          ) : charView === "map" ? (
