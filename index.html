function TimerWidget({ onSessionComplete }) {
  const [duration, setDuration] = useState(25 * 60);
  const [remaining, setRemaining] = useState(25 * 60);
  const [running, setRunning] = useState(false);
  const [startWords, setStartWords] = useState(0);
  const intervalRef = useRef(null);
  const [customOpen, setCustomOpen] = useState(false);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setRemaining((r) => {
          if (r <= 1) {
            clearInterval(intervalRef.current);
            setRunning(false);
            onSessionComplete(Math.round(duration / 60), "done");
            return 0;
          }
          return r - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  function start(mins) {
    const secs = mins * 60;
    setDuration(secs); setRemaining(secs); setRunning(true); setCustomOpen(false);
    setStartWords(onSessionComplete("get-current-words"));
  }
  function stop(finished) {
    setRunning(false);
    clearInterval(intervalRef.current);
    const elapsedMin = Math.max(1, Math.round((duration - remaining) / 60));
    if (finished) onSessionComplete(elapsedMin, "manual-stop");
  }
  function reset() { setRunning(false); clearInterval(intervalRef.current); setRemaining(duration); }

  const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
  const ss = String(remaining % 60).padStart(2, "0");

  return (
    <div className="sd-card rounded-2xl p-4">
      <p className="text-xs font-medium mb-2" style={{ color: "var(--text-faint)" }}>Writing timer</p>
      {!running && remaining === duration ? (
        <div className="flex flex-wrap gap-2">
          {[15, 25, 45].map((m) => (
            <button key={m} onClick={() => start(m)} className="px-3 py-2 rounded-lg text-sm font-medium sd-focus" style={{ background: "var(--bg-sunken)", color: "var(--text-primary)" }}>{m} min</button>
          ))}
          <button onClick={() => setCustomOpen(true)} className="px-3 py-2 rounded-lg text-sm font-medium sd-focus" style={{ background: "var(--bg-sunken)", color: "var(--text-primary)" }}>Custom</button>
          {customOpen && (
            <div className="flex items-center gap-2 mt-1 w-full">
              <TextInput type="number" min={1} placeholder="Minutes" className="w-24" id="custom-timer-input" />
              <Btn size="sm" onClick={() => { const v = Number(document.getElementById("custom-timer-input").value) || 20; start(v); }}>Start</Btn>
            </div>
          )}
        </div>
      ) : (
        <div>
          <div className="flex items-center justify-between mb-2">
            <span className="text-2xl font-semibold tabular-nums sd-serif" style={{ color: "var(--text-primary)" }}>{mm}:{ss}</span>
            <div className="flex gap-1">
              <IconBtn icon={running ? Pause : Play} label={running ? "Pause" : "Resume"} onClick={() => setRunning((r) => !r)} />
              <IconBtn icon={RotateCcw} label="Reset" onClick={reset} />
            </div>
          </div>
          <ProgressBar value={duration - remaining} max={duration} height={5} />
        </div>
      )}
    </div>
  );
}

function ExportModal({ open, onClose, chapters, story, toast }) {
  const [selected, setSelected] = useState([]);
  const [showPreview, setShowPreview] = useState(false);
  const [epubBusy, setEpubBusy] = useState(false);
  const [docxBusy, setDocxBusy] = useState(false);
  useEffect(() => { if (open && chapters.length) setSelected([chapters[0].id]); setShowPreview(false); }, [open, chapters]);
  const toggle = (id) => setSelected((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);
  const selectedChapters = chapters.filter((c) => selected.includes(c.id));

  function buildText() {
    return selectedChapters.map((c) => {
      const body = htmlToWattpadText(normalizeChapterHtml(c.content));
      return `${c.title}\n\n${body}`;
    }).join("\n\n\n");
  }
  async function copy() {
    try { await navigator.clipboard.writeText(buildText()); toast("Copied to clipboard"); } catch (e) { toast("Couldn't copy — try downloading instead"); }
  }
  function download() {
    const blob = new Blob([buildText()], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "wattpad-export.txt"; a.click();
    URL.revokeObjectURL(url);
    toast("Downloaded TXT");
  }
  async function downloadEpub() {
    if (!selectedChapters.length) return;
    setEpubBusy(true);
    try {
      const blob = await buildEpubBlob(story || { title: "StoryDesk Export" }, selectedChapters);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `${(story?.title || "storydesk-export").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}.epub`; a.click();
      URL.revokeObjectURL(url);
      toast("EPUB downloaded");
    } catch (e) {
      toast("Couldn't build the EPUB — try again");
    }
    setEpubBusy(false);
  }
  async function downloadDocx() {
    if (!selectedChapters.length) return;
    setDocxBusy(true);
    try {
      const blob = await buildDocxBlob(story || { title: "StoryDesk Export" }, selectedChapters);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `${(story?.title || "storydesk-export").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}.docx`; a.click();
      URL.revokeObjectURL(url);
      toast("DOCX downloaded");
    } catch (e) {
      toast("Couldn't build the DOCX — try again");
    }
    setDocxBusy(false);
  }
  function doPrint() {
    if (!printChapters(selectedChapters)) toast("Please allow pop-ups to print");
  }

  return (
    <Modal open={open} onClose={onClose} title="Export for Wattpad" width="max-w-xl">
      <p className="text-sm mb-3" style={{ color: "var(--text-muted)" }}>Select chapters to prepare. This doesn't publish anything — it just gets clean text (or a file) ready for you to use elsewhere.</p>
      <div className="space-y-1.5 mb-3 max-h-44 overflow-y-auto sd-scroll">
        {chapters.map((c) => (
          <label key={c.id} className="flex items-center gap-2.5 px-2 py-2 rounded-lg cursor-pointer" style={{ background: selected.includes(c.id) ? "var(--accent-soft)" : "transparent" }}>
            <input type="checkbox" checked={selected.includes(c.id)} onChange={() => toggle(c.id)} />
            <span className="text-sm" style={{ color: "var(--text-primary)" }}>{c.title || "Untitled"}</span>
            <span className="text-xs ml-auto" style={{ color: "var(--text-faint)" }}>{c.wordCount || 0}w</span>
          </label>
        ))}
      </div>

      <button onClick={() => setShowPreview((v) => !v)} className="text-xs font-medium mb-3 sd-focus" style={{ color: "var(--accent)" }}>
        {showPreview ? "Hide preview" : "Preview formatting"}
      </button>
      {showPreview && (
        <div className="rounded-xl p-4 mb-3 max-h-56 overflow-y-auto sd-scroll" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)" }}>

function Write({ ws, update, storyId, chapterId, go, toast, autoCreateChapter }) {
  const stories = ws.stories;
  const [activeStoryId, setActiveStoryId] = useState(storyId || stories[0]?.id || null);
  const activeStory = stories.find((s) => s.id === activeStoryId) || stories[0];
  const [activeChapterId, setActiveChapterId] = useState(chapterId || activeStory?.chapters[0]?.id || null);
  const chapter = activeStory?.chapters.find((c) => c.id === activeChapterId);

  const [content, setContent] = useState(() => normalizeChapterHtml(chapter?.content || ""));
  const [saveState, setSaveState] = useState("saved");
  const [showExport, setShowExport] = useState(false);
  const [showTimer, setShowTimer] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [showInsights, setShowInsights] = useState(false);
  const [showPreview, setShowPreview] = useState(false);
  const [focusMode, setFocusMode] = useState(false);
  const [sessionResult, setSessionResult] = useState(null);
  const editorRef = useRef(null);
  const scrollRef = useRef(null);
  const saveTimer = useRef(null);
  const lastSavedCount = useRef(chapter?.wordCount || 0);

  useEffect(() => {
    if (storyId) setActiveStoryId(storyId);
  }, [storyId]);
  useEffect(() => {
    if (chapterId) setActiveChapterId(chapterId);
    else if (activeStory && !activeStory.chapters.find((c) => c.id === activeChapterId)) {
      setActiveChapterId(activeStory.chapters[0]?.id || null);
    }
    // eslint-disable-next-line
  }, [chapterId, activeStoryId]);

  // Load chapter content into the editor + restore last cursor position (Phase 1)
  useEffect(() => {
    const html = normalizeChapterHtml(chapter?.content || "");
    setContent(html);
    lastSavedCount.current = chapter?.wordCount || 0;
    setSaveState("saved");
    if (editorRef.current) {
      editorRef.current.innerHTML = html;
      const targetOffset = clamp(chapter?.lastCursorOffset || 0, 0, editorRef.current.textContent.length);
      requestAnimationFrame(() => {
        try {
          editorRef.current.focus();
          setCaretPosition(editorRef.current, targetOffset);
        } catch (e) { /* noop */ }
      });
    }
    // eslint-disable-next-line
  }, [activeChapterId]);

  const wc = wordCount(htmlToPlainText(content));
  const insightStats = useMemo(() => analyzeChapterText(htmlToPlainText(content)), [content]);

  const persistContent = useCallback((html) => {
    if (!activeStory || !chapter) return;
    const newCount = wordCount(htmlToPlainText(html));
    const delta = newCount - lastSavedCount.current;
    lastSavedCount.current = newCount;
    const today = todayStr();
    const now = new Date().toISOString();
    const cursorOffset = editorRef.current && document.activeElement === editorRef.current
      ? getCaretCharacterOffsetWithin(editorRef.current)
      : (chapter.lastCursorOffset || 0);

    update((w) => ({
      ...w,
      dailyLog: { ...w.dailyLog, [today]: Math.max(0, (w.dailyLog[today] || 0) + delta) },
      stories: w.stories.map((s) => {
        if (s.id !== activeStory.id) return s;
        return {
          ...s,
          updatedAt: now,
          chapters: s.chapters.map((c) => {
            if (c.id !== chapter.id) return c;
            const versions = c.versions || [];
            const last = versions[versions.length - 1];
            const shouldSnapshot = !last || (Date.now() - new Date(last.savedAt).getTime() > 3 * 60 * 1000 && Math.abs(newCount - (last.wordCount || 0)) >= 20);
            const nextVersions = shouldSnapshot ? [...versions, { id: uid("ver"), content: html, wordCount: newCount, savedAt: now }].slice(-20) : versions;
            return { ...c, content: html, wordCount: newCount, updatedAt: now, lastCursorOffset: cursorOffset, versions: nextVersions };
          }),
        };
      }),
    }));
    setSaveState("saved");
  }, [activeStory, chapter, update]);

  const contentRef = useRef(content);
  useEffect(() => { contentRef.current = content; }, [content]);

  function handleInput() {
    if (!editorRef.current) return;
    const html = editorRef.current.innerHTML;
    setContent(html);
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => persistContent(html), 600);
    if (focusMode) centerCaret();
  }

  function centerCaret() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !scrollRef.current) return;
    const range = sel.getRangeAt(0).cloneRange();
    range.collapse(true);
    const rect = range.getBoundingClientRect();
    if (rect.top === 0 && rect.bottom === 0) return;
    const containerRect = scrollRef.current.getBoundingClientRect();
    const targetY = containerRect.top + containerRect.height / 2;
    scrollRef.current.scrollTop += rect.top - targetY;
  }

  useEffect(() => {
    function onKey(e) {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); persistContent(contentRef.current); toast("Chapter saved"); }
      if (mod && e.key.toLowerCase() === "n") { e.preventDefault(); createChapter(); }
      if (mod && e.shiftKey && e.key.toLowerCase() === "e") { e.preventDefault(); setShowExport(true); }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [persistContent]);

  function format(type) {
    const el = editorRef.current;
    if (!el) return;
    el.focus();
    if (type === "bold") document.execCommand("bold");
    else if (type === "italic") document.execCommand("italic");
    else if (type === "underline") document.execCommand("underline");
    else if (type === "quote") document.execCommand("formatBlock", false, "blockquote");
    else if (type === "divider") document.execCommand("insertHTML", false, "<hr/><p><br/></p>");
    handleInput();
  }

  function forceSnapshot() {
    if (!activeStory || !chapter || !editorRef.current) return;
    const html = editorRef.current.innerHTML;
    const words = wordCount(htmlToPlainText(html));
    const now = new Date().toISOString();
    update((w) => ({
      ...w,
      stories: w.stories.map((s) => s.id !== activeStory.id ? s : {
        ...s,
        chapters: s.chapters.map((c) => c.id !== chapter.id ? c : { ...c, versions: [...(c.versions || []), { id: uid("ver"), content: html, wordCount: words, savedAt: now }].slice(-20) }),
      }),
    }));
  }

  function restoreVersion(version) {
    forceSnapshot();
    if (editorRef.current) editorRef.current.innerHTML = version.content;
    setContent(version.content);
    persistContent(version.content);
    setShowHistory(false);
    toast("Version restored");
  }

  function createChapter() {
    if (!activeStory) return;
    const now = new Date().toISOString();
    const newChapter = { id: uid("chap"), order: activeStory.chapters.length, title: `Chapter ${activeStory.chapters.length + 1}`, content: "", status: "Draft", wordCount: 0, createdAt: now, updatedAt: now, summary: "", location: "", linkedCharacterIds: [], tags: [], storyTimeOrder: activeStory.chapters.length, storyTimeLabel: "", versions: [], lastCursorOffset: 0 };
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === activeStory.id ? { ...s, chapters: [...s.chapters, newChapter] } : s) }));
    setActiveChapterId(newChapter.id);
    toast("Chapter created");
  }

  function renameChapter(title) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id !== activeStory.id ? s : { ...s, chapters: s.chapters.map((c) => c.id === chapter.id ? { ...c, title } : c) }) }));
  }

  const autoCreatedRef = useRef(false);
  useEffect(() => {
    if (autoCreateChapter && activeStory && !autoCreatedRef.current) {
      autoCreatedRef.current = true;
      createChapter();
    }
    // eslint-disable-next-line
  }, [autoCreateChapter, activeStory?.id]);

  function handleSessionEvent(payload, type) {
    if (payload === "get-current-words") return wc;
    if (type === "done" || type === "manual-stop") {
      update((w) => ({ ...w, sessions: [...w.sessions, { id: uid("sess"), date: todayStr(), durationMin: payload, words: wc, startedAt: new Date().toISOString() }] }));
      setSessionResult({ minutes: payload, words: wc, done: true });
      toast("Writing session saved");
    }
  }

  if (!stories.length) {
    return (
      <div className="max-w-2xl mx-auto px-6 py-16">
        <EmptyState icon={PenLine} title="Nothing to write yet" body="Create a story first, then come back here to start writing." actionLabel="Create Story" onAction={() => go("stories", { create: true })} />
      </div>
    );
  }

  const chapterIndex = activeStory ? activeStory.chapters.findIndex((c) => c.id === chapter?.id) : -1;
  const prevChapter = chapterIndex > 0 ? activeStory.chapters[chapterIndex - 1] : null;
  const nextChapter = chapterIndex >= 0 && chapterIndex < activeStory.chapters.length - 1 ? activeStory.chapters[chapterIndex + 1] : null;

  return (
    <div className="flex flex-col h-full min-h-screen md:min-h-0">
      <div className="flex items-center gap-3 px-4 sm:px-6 py-3 border-b transition-opacity duration-200" style={{ borderColor: "var(--border)", background: "var(--bg-surface)", opacity: focusMode ? 0.4 : 1 }}>
        <IconBtn icon={ArrowLeft} label="Back" onClick={() => go(storyId ? "story" : "home", { storyId: activeStory?.id })} />
        <Select value={activeStoryId || ""} onChange={(e) => { setActiveStoryId(e.target.value); const s = stories.find((x) => x.id === e.target.value); setActiveChapterId(s?.chapters[0]?.id || null); }} className="max-w-[160px]">
          {stories.map((s) => <option key={s.id} value={s.id}>{s.title}</option>)}
        </Select>
        <Select value={activeChapterId || ""} onChange={(e) => setActiveChapterId(e.target.value)} className="max-w-[180px]">
          {activeStory?.chapters.map((c) => <option key={c.id} value={c.id}>{c.title || "Untitled"}</option>)}
        </Select>
        <IconBtn icon={Plus} label="New chapter" onClick={createChapter} />
        <div className="ml-auto flex items-center gap-1">
          <span className="text-xs mr-2 hidden sm:inline" style={{ color: "var(--text-faint)" }}>{saveState === "saving" ? "Saving..." : "Saved ✓"}</span>
          <IconBtn icon={FocusIcon} label="Focus mode" onClick={() => setFocusMode((v) => !v)} variant={focusMode ? "solid" : "ghost"} />
          <IconBtn icon={HistoryIcon} label="Version history" onClick={() => setShowHistory(true)} />
          <IconBtn icon={Activity} label="Writing insights" onClick={() => setShowInsights((v) => !v)} variant={showInsights ? "solid" : "ghost"} />
          <IconBtn icon={Eye} label="Preview as reader" onClick={() => setShowPreview(true)} />
          <IconBtn icon={Clock} label="Writing timer" onClick={() => setShowTimer((v) => !v)} />
          <IconBtn icon={Download} label="Export for Wattpad" onClick={() => setShowExport(true)} />
        </div>
      </div>

      {!chapter ? (
        <EmptyState icon={FileText} title="No chapter selected" body="Create a chapter to begin writing." actionLabel="New Chapter" onAction={createChapter} />
      ) : (
        <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
          <div ref={scrollRef} className="flex-1 flex flex-col overflow-y-auto sd-scroll">
            <div className="max-w-2xl w-full mx-auto px-5 sm:px-8 pt-8 transition-all duration-300" style={{ paddingBottom: focusMode ? "50vh" : "1rem" }}>
              <input
                value={chapter.title}
                onChange={(e) => renameChapter(e.target.value)}
                placeholder="Chapter title"
                className="w-full text-2xl sm:text-3xl font-semibold bg-transparent outline-none sd-serif mb-1 transition-opacity duration-200"
                style={{ color: "var(--text-primary)", opacity: focusMode ? 0.35 : 1 }}
              />
              <p className="text-xs mb-4 transition-opacity duration-200" style={{ color: "var(--text-faint)", opacity: focusMode ? 0.35 : 1 }}>Chapter {chapterIndex + 1} of {activeStory.chapters.length}</p>

              <div className="flex items-center gap-1 mb-3 sticky top-0 py-1.5 z-10 rounded-lg transition-opacity duration-200" style={{ background: "var(--bg-paper)", opacity: focusMode ? 0.25 : 1 }}>
                <IconBtn icon={Bold} label="Bold" onClick={() => format("bold")} />
                <IconBtn icon={Italic} label="Italic" onClick={() => format("italic")} />
                <IconBtn icon={Underline} label="Underline" onClick={() => format("underline")} />
                <IconBtn icon={Quote} label="Blockquote" onClick={() => format("quote")} />
                <IconBtn icon={Minus} label="Scene divider" onClick={() => format("divider")} />
              </div>

              <div
                ref={editorRef}
                contentEditable
                suppressContentEditableWarning
                role="textbox"
                aria-multiline="true"
                aria-label={`Chapter text: ${chapter.title || "Untitled chapter"}`}
                onInput={handleInput}
                onKeyUp={() => focusMode && centerCaret()}
                onMouseUp={() => focusMode && centerCaret()}
                data-placeholder="Once upon a time..."
                className="sd-editor w-full outline-none leading-relaxed"
                style={{ color: "var(--text-primary)", fontFamily: "'Source Serif 4', Georgia, serif", fontSize: "1.15rem", lineHeight: 1.85, minHeight: "60vh" }}
                spellCheck
              />
            </div>
            <div className="sticky bottom-0 border-t px-5 sm:px-8 py-3 flex items-center gap-3 text-xs flex-wrap transition-opacity duration-200" style={{ borderColor: "var(--border)", background: "var(--bg-surface)", color: "var(--text-faint)", opacity: focusMode ? 0.3 : 1 }}>
              <span>{wc.toLocaleString()} words</span>
              <span>{readingTime(wc)}</span>
              <div className="flex items-center gap-1 mx-1">
                <IconBtn icon={ChevronLeft} label="Previous chapter" size={14} onClick={() => prevChapter && setActiveChapterId(prevChapter.id)} className={!prevChapter ? "opacity-30 pointer-events-none" : ""} />
                <IconBtn icon={ChevronRight} label="Next chapter" size={14} onClick={() => nextChapter && setActiveChapterId(nextChapter.id)} className={!nextChapter ? "opacity-30 pointer-events-none" : ""} />
              </div>
              <span className="ml-auto font-medium" style={{ color: saveState === "saving" ? "var(--text-faint)" : "var(--success)" }}>{saveState === "saving" ? "Saving..." : "Auto-saved ✓"}</span>
            </div>
          </div>

          {(showTimer || showInsights) && (
            <div className="w-full md:w-72 shrink-0 border-t md:border-t-0 md:border-l p-4 space-y-4 overflow-y-auto sd-scroll" style={{ borderColor: "var(--border)" }}>
              {showTimer && (
                <div>
                  <TimerWidget onSessionComplete={handleSessionEvent} />
                  {sessionResult?.done && (
                    <div className="sd-card rounded-xl p-4 mt-3 text-center sd-anim">
                      <p className="font-semibold mb-1" style={{ color: "var(--text-primary)" }}>Session complete 🎉</p>
                      <p className="text-sm" style={{ color: "var(--text-muted)" }}>You wrote for {sessionResult.minutes} min, ending at {sessionResult.words.toLocaleString()} words in this chapter.</p>
                    </div>
                  )}
                </div>
              )}
              {showInsights && <WritingInsightsPanel stats={insightStats} />}
            </div>
          )}
        </div>
      )}

      <ReaderPreviewModal open={showPreview} onClose={() => setShowPreview(false)} chapter={chapter} />

      <ExportModal open={showExport} onClose={() => setShowExport(false)} chapters={activeStory?.chapters || []} story={activeStory} toast={toast} />
      <VersionHistoryPanel open={showHistory} onClose={() => setShowHistory(false)} versions={chapter?.versions} onRestore={restoreVersion} />
    </div>
  );
}

function PlanPage({ ws, update, go, toast, planStoryId, setPlanStoryId }) {
  const stories = ws.stories;

  }
  function setChapters(chapters) {
    update((w) => ({ ...w, stories: w.stories.map((s) => s.id === story.id ? { ...s, chapters, updatedAt: new Date().toISOString() } : s) }));
  }
  function saveChapterEdit(form) {

        ? <EmptyState icon={LayoutGrid} title="Nothing to plan yet" body="Add a few chapters in this story to start dragging them across stages." actionLabel="Go to Story" onAction={() => go("story", { storyId: story.id })} />
        : <PlanBoard story={story} onUpdateChapters={setChapters} onOpenChapter={(c) => setEditingChapter(c)} characters={storyCharacters} tagFilter={tagFilter} />
      )}
      <ChapterFormModal open={!!editingChapter} onClose={() => setEditingChapter(null)} onSave={saveChapterEdit} initial={editingChapter} characters={storyCharacters} />

  );
}

function relLabel(type) { return RELATIONSHIP_TYPES.find((r) => r.id === type)?.icon || "◇"; }

function buildRelationshipPairs(characters) {
  const ids = new Set(characters.map((c) => c.id));
  const pairs = {};
  characters.forEach((c) => {
    (c.relationships || []).forEach((r) => {
      if (!ids.has(r.targetId)) return;
      const key = [c.id, r.targetId].sort().join("|");
      if (!pairs[key]) pairs[key] = { a: c.id, b: r.targetId, types: [] };
      if (!pairs[key].types.includes(r.type)) pairs[key].types.push(r.type);
    });
  });
  return Object.values(pairs);
}

function RelationshipMap({ characters, onOpen }) {
  if (characters.length === 0) return null;
  const size = 380;
  const center = size / 2;
  const radius = characters.length === 1 ? 0 : Math.min(150, 60 + characters.length * 12);
  const positions = {};
  characters.forEach((c, i) => {
    const angle = (2 * Math.PI * i) / characters.length - Math.PI / 2;
    positions[c.id] = { x: center + radius * Math.cos(angle), y: center + radius * Math.sin(angle) };
  });
  const pairs = buildRelationshipPairs(characters);

  return (
    <div className="sd-card rounded-2xl p-4">
      <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-auto" style={{ maxHeight: 440 }}>
        {pairs.map((p) => {
          const a = positions[p.a], b = positions[p.b];
          const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
          return (
            <g key={p.a + p.b}>
              <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="var(--border)" strokeWidth="2" />
              <rect x={midX - 16} y={midY - 11} width="32" height="18" rx="9" fill="var(--bg-surface)" />
              <text x={midX} y={midY + 4} textAnchor="middle" fontSize="13" style={{ fill: "var(--accent)" }}>
                {p.types.map(relLabel).join(" ")}
              </text>
            </g>
          );
        })}
        {characters.map((c) => {
          const pos = positions[c.id];
          return (
            <g key={c.id} onClick={() => onOpen(c.id)} style={{ cursor: "pointer" }}>
              <circle cx={pos.x} cy={pos.y} r="26" fill={c.imageColor || "var(--accent)"} />
              <text x={pos.x} y={pos.y + 4} textAnchor="middle" fontSize="11" fontWeight="600" fill="#fff">{initialsOf(c.name)}</text>
              <text x={pos.x} y={pos.y + 42} textAnchor="middle" fontSize="12" fontWeight="500" style={{ fill: "var(--text-primary)" }}>{c.name.length > 14 ? c.name.slice(0, 13) + "…" : c.name}</text>
            </g>
          );
        })}
      </svg>
      {pairs.length === 0 && (
        <p className="text-xs text-center mt-2" style={{ color: "var(--text-faint)" }}>No relationships added between these characters yet — add some from a character's profile.</p>
      )}
    </div>
  );
}

function CharacterDetail({ ws, update, character, onClose, onEdit, toast }) {

function Characters({ ws, update, go, toast, initialCreate, initialOpenId, initialStoryId }) {
  const [showForm, setShowForm] = useState(!!initialCreate);
  const [editing, setEditing] = useState(null);
  const [openId, setOpenId] = useState(initialOpenId || null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const characters = ws.characters || [];

  function createCharacter(form) {
    const now = new Date().toISOString();
    const palette = ["#D9A679", "#7A93A6", "#B4876B", "#8C7AA6", "#7AA68C"];
    const character = { id: uid("char"), ...form, storyIds: form.storyIds?.length ? form.storyIds : (initialStoryId ? [initialStoryId] : []), imageColor: palette[characters.length % palette.length], relationships: [], createdAt: now, updatedAt: now };
    update((w) => ({ ...w, characters: [...(w.characters || []), character] }));
    setShowForm(false);

function WeekChart({ dailyLog }) {
  const days = Array.from({ length: 7 }, (_, i) => 6 - i).map((n) => ({ label: new Date(Date.now() - n * 86400000).toLocaleDateString(undefined, { weekday: "short" }).slice(0, 1), date: daysAgoStr(n), words: Math.max(0, dailyLog[daysAgoStr(n)] || 0) }));
  const max = Math.max(...days.map((d) => d.words), 100);
  return (
    <div className="flex items-end gap-2.5 h-36 px-1">
      {days.map((d) => (
        <div key={d.date} className="flex-1 flex flex-col items-center gap-2">
          <div className="w-full flex items-end justify-center" style={{ height: 100 }}>
            <div className="w-full max-w-[26px] rounded-t-md transition-all duration-500" style={{ height: `${Math.max(4, (d.words / max) * 100)}%`, background: d.words > 0 ? "var(--accent)" : "var(--bg-sunken)" }} title={`${d.words} words`} />
          </div>
          <span className="text-xs font-medium" style={{ color: "var(--text-faint)" }}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

function recentDailyAverage(dailyLog, days = 14) {
  let total = 0, count = 0;
  for (let i = 0; i < days; i++) {
    const w = dailyLog[daysAgoStr(i)] || 0;
    if (w > 0) { total += w; count++; }
  }
  return count > 0 ? total / count : 0;
}

function estimateFinish(remainingWords, dailyAvg) {
  if (remainingWords <= 0) return { done: true };
  if (dailyAvg <= 0) return null;
  const days = Math.ceil(remainingWords / dailyAvg);
  const d = new Date();
  d.setDate(d.getDate() + days);
  return { done: false, days, date: d };
}

function bestWritingDay(dailyLog) {
  let bestDate = null, bestWords = 0;
  Object.entries(dailyLog).forEach(([date, words]) => { if (words > bestWords) { bestWords = words; bestDate = date; } });
  return bestDate ? { date: bestDate, words: bestWords } : null;
}

function timeOfDayBuckets(sessions) {
  const buckets = { Morning: 0, Afternoon: 0, Evening: 0, Night: 0 };
  sessions.forEach((s) => {
    const h = new Date(s.startedAt).getHours();
    if (h >= 5 && h < 12) buckets.Morning++;
    else if (h >= 12 && h < 17) buckets.Afternoon++;
    else if (h >= 17 && h < 22) buckets.Evening++;
    else buckets.Night++;
  });
  return buckets;
}

function MonthlyHeatmap({ dailyLog }) {
  const weeks = 17;
  const totalDays = weeks * 7;
  const days = Array.from({ length: totalDays }, (_, i) => totalDays - 1 - i).map((n) => {
    const date = daysAgoStr(n);
    return { date, words: Math.max(0, dailyLog[date] || 0) };
  });
  const max = Math.max(...days.map((d) => d.words), 1);
  function bg(words) {
    if (words <= 0) return "var(--bg-sunken)";
    const ratio = words / max;
    if (ratio > 0.66) return "var(--accent)";
    if (ratio > 0.33) return "var(--accent-soft)";
    return "var(--bg-sunken)";
  }
  const columns = [];
  for (let i = 0; i < days.length; i += 7) columns.push(days.slice(i, i + 7));
  return (
    <div className="overflow-x-auto sd-scroll pb-1">
      <div className="flex gap-[3px]" style={{ minWidth: columns.length * 14 }}>
        {columns.map((col, ci) => (
          <div key={ci} className="flex flex-col gap-[3px]">
            {col.map((d) => (
              <div key={d.date} title={`${d.date}: ${d.words} words`} className="rounded-sm" style={{ width: 11, height: 11, background: bg(d.words), opacity: d.words > max * 0.33 ? 1 : 0.9 }} />
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

function Progress({ ws, update, toast }) {
  const [showMilestoneForm, setShowMilestoneForm] = useState(false);

  const storyGoalWords = ws.stories.reduce((s, st) => s + (st.targetWords || 0), 0) || 1;
  const streak = (() => { let n = 0; for (let i = 0; ; i++) { if ((ws.dailyLog[daysAgoStr(i)] || 0) > 0) n++; else break; } return n; })();
  const weekWords = Array.from({ length: 7 }, (_, i) => Math.max(0, ws.dailyLog[daysAgoStr(i)] || 0)).reduce((a, b) => a + b, 0);
  const best = bestWritingDay(ws.dailyLog);
  const dailyAvg = recentDailyAverage(ws.dailyLog);
  const buckets = timeOfDayBuckets(ws.sessions || []);
  const maxBucket = Math.max(...Object.values(buckets), 1);
  const milestones = ws.milestones || [];

  function addMilestone(form) {
    const m = { id: uid("mile"), title: form.title.trim(), kind: form.kind, targetValue: Number(form.targetValue) || 0, targetDate: form.targetDate || "", completed: false, createdAt: new Date().toISOString() };

    toast("Milestone added");

  function toggleMilestone(id, completed) {
    update((w) => ({ ...w, milestones: (w.milestones || []).map((m) => m.id === id ? { ...m, completed } : m) }));
  }
  function deleteMilestone(id) {
    update((w) => ({ ...w, milestones: (w.milestones || []).filter((m) => m.id !== id) }));
  }

  const cards = [
    { label: "Total Words", value: totals.words.toLocaleString() },
    { label: "Chapters", value: `${totals.complete} / ${totals.chapters}` },
    { label: "Story Completion", value: `${pct(totals.words, storyGoalWords)}%` },
    { label: "Current Streak", value: `${streak} day${streak === 1 ? "" : "s"}` },
    { label: "Writing Sessions", value: ws.sessions.length },
    { label: "Words This Week", value: weekWords.toLocaleString() },
  ];

function Settings({ ws, update, clearAll, toast, theme, setThemePref, onLoadSample }) {
  const [confirmClear, setConfirmClear] = useState(false);
  const [confirmSample, setConfirmSample] = useState(false);
  const [confirmRestoreBackup, setConfirmRestoreBackup] = useState(null);
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);

  function setSetting(key, value) {
    update((w) => ({ ...w, settings: { ...w.settings, [key]: value } }));
  }
  function setGoal(key, value) {
    update((w) => ({ ...w, goals: { ...w.goals, [key]: Number(value) || 0 } }));
  }
  function exportBackup() {
    const blob = new Blob([JSON.stringify(ws, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `storydesk-backup-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
    update((w) => ({ ...w, lastBackupAt: new Date().toISOString() }));
    toast("Backup downloaded");
  }
  function restoreAutoBackup(entry) {
    try {
      const parsed = JSON.parse(entry.data);
      update((w) => ({ ...parsed, autoBackups: w.autoBackups }));
      setConfirmRestoreBackup(null);
      toast("Restored from automatic backup");
    } catch (e) {
      toast("Couldn't read that backup");
    }
  }
  function onImportFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.stories)) throw new Error("bad shape");
        update(() => parsed);
        setImportError("");
        toast("Backup imported");
      } catch (err) {
        setImportError("That file doesn't look like a valid StoryDesk backup.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const themeOptions = [{ id: "light", label: "Light", icon: Sun }, { id: "dark", label: "Dark", icon: Moon }, { id: "system", label: "System", icon: Monitor }];

  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-10 pb-28 md:pb-10 sd-anim">
      <h1 className="text-2xl font-semibold mb-6 sd-serif" style={{ color: "var(--text-primary)" }}>Settings</h1>

      <section className="mb-6">
        <h2 className="text-sm font-semibold mb-3" style={{ color: "var(--text-faint)" }}>APPEARANCE</h2>
        <div className="sd-card rounded-2xl p-4 flex gap-2">
          {themeOptions.map((t) => (
            <button key={t.id} onClick={() => setThemePref(t.id)} className="flex-1 flex flex-col items-center gap-1.5 py-3 rounded-xl sd-focus" style={{ background: ws.settings.theme === t.id ? "var(--accent-soft)" : "var(--bg-surface-2)", color: ws.settings.theme === t.id ? "var(--accent)" : "var(--text-muted)" }}>
              <t.icon size={18} /><span className="text-xs font-medium">{t.label}</span>
            </button>
          ))}
        </div>
      </section>

      <section className="mb-6">
        <h2 className="text-sm font-semibold mb-3" style={{ color: "var(--text-faint)" }}>WRITING GOALS</h2>
        <div className="sd-card rounded-2xl p-4 grid grid-cols-2 gap-3">
          <Field label="Daily word goal"><TextInput type="number" value={ws.goals.dailyWords} onChange={(e) => setGoal("dailyWords", e.target.value)} /></Field>
          <Field label="Weekly word goal"><TextInput type="number" value={ws.goals.weeklyWords} onChange={(e) => setGoal("weeklyWords", e.target.value)} /></Field>
        </div>
      </section>

      <section className="mb-6">
        <h2 className="text-sm font-semibold mb-3" style={{ color: "var(--text-faint)" }}>WRITING</h2>
        <div className="sd-card rounded-2xl p-4 space-y-4">
          <Field label="Editor width">
            <Select value={ws.settings.editorWidth} onChange={(e) => setSetting("editorWidth", e.target.value)}>
              <option value="narrow">Narrow</option><option value="medium">Medium</option><option value="wide">Wide</option>
            </Select>
          </Field>
          <Field label="Line spacing">
            <Select value={ws.settings.lineSpacing} onChange={(e) => setSetting("lineSpacing", e.target.value)}>
              <option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="relaxed">Relaxed</option>
            </Select>
          </Field>
        </div>
      </section>

      <section className="mb-6">
        <h2 className="text-sm font-semibold mb-3" style={{ color: "var(--text-faint)" }}>DATA</h2>
        <div className="sd-card rounded-2xl p-4 space-y-2">
          <Btn variant="secondary" icon={Download} onClick={exportBackup} className="w-full justify-start">Export Backup</Btn>
          <Btn variant="secondary" icon={Upload} onClick={() => fileInputRef.current?.click()} className="w-full justify-start">Import Backup</Btn>
          <input type="file" accept="application/json" ref={fileInputRef} className="hidden" onChange={onImportFile} />
          {importError && <p className="text-xs" style={{ color: "var(--danger)" }}>{importError}</p>}
          {ws.lastBackupAt && <p className="text-xs" style={{ color: "var(--text-faint)" }}>Last manual backup: {timeAgo(ws.lastBackupAt)}</p>}
          {onLoadSample && <Btn variant="secondary" icon={BookOpen} onClick={() => setConfirmSample(true)} className="w-full justify-start">Load Sample Data</Btn>}
          <Btn variant="danger" icon={Trash2} onClick={() => setConfirmClear(true)} className="w-full justify-start">Clear All Data</Btn>

          {(ws.autoBackups || []).length > 0 && (
            <div className="pt-2">
              <p className="text-xs font-medium mb-1.5" style={{ color: "var(--text-faint)" }}>Automatic local backups</p>
              <p className="text-xs mb-2" style={{ color: "var(--text-faint)" }}>StoryDesk quietly keeps a few recent snapshots on this device as a safety net — not a substitute for exporting a backup yourself.</p>
              <div className="space-y-1.5">
                {[...ws.autoBackups].reverse().map((b) => (
                  <div key={b.id} className="flex items-center justify-between text-xs px-2.5 py-2 rounded-lg" style={{ background: "var(--bg-surface-2)" }}>
                    <span style={{ color: "var(--text-muted)" }}>{new Date(b.savedAt).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
                    <button onClick={() => setConfirmRestoreBackup(b)} className="font-semibold sd-focus" style={{ color: "var(--accent)" }}>Restore</button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </section>

      <section>
        <h2 className="text-sm font-semibold mb-3" style={{ color: "var(--text-faint)" }}>ABOUT</h2>
        <div className="sd-card rounded-2xl p-4">
          <p className="font-semibold sd-serif mb-1" style={{ color: "var(--text-primary)" }}>StoryDesk</p>
          <p className="text-xs mb-1" style={{ color: "var(--text-faint)" }}>Version 1.0.0 (MVP)</p>
          <p className="text-sm" style={{ color: "var(--text-muted)" }}>Your writing workspace, before you hit Publish. Everything is stored on this device.</p>
        </div>
      </section>

      <ConfirmDialog
        open={confirmClear}
        onClose={() => setConfirmClear(false)}
        onConfirm={() => { clearAll(); setConfirmClear(false); toast("All data cleared"); }}
        title="Clear all data?"
        body="This deletes every story, chapter, character, and idea from this device. Export a backup first if you want to keep a copy."
        confirmLabel="Clear Everything"
        danger
      />
      <ConfirmDialog
        open={confirmSample}
        onClose={() => setConfirmSample(false)}
        onConfirm={() => { onLoadSample(); setConfirmSample(false); toast("Sample data loaded"); }}
        title="Load sample data?"
        body="This replaces everything currently in your workspace with the “My First Love” demo story. Export a backup first if you want to keep your current work."
        confirmLabel="Load Sample Data"
        danger
      />
      <ConfirmDialog
        open={!!confirmRestoreBackup}
        onClose={() => setConfirmRestoreBackup(null)}
        onConfirm={() => restoreAutoBackup(confirmRestoreBackup)}
        title="Restore this backup?"
        body={`This replaces your current workspace with the automatic snapshot from ${confirmRestoreBackup ? new Date(confirmRestoreBackup.savedAt).toLocaleString() : ""}. Anything written since then will be lost.`}
        confirmLabel="Restore"
        danger
      />
    </div>
  );
}

function SearchPalette({ open, onClose, ws, go }) {
  const [q, setQ] = useState("");
  useEffect(() => { if (open) setQ(""); }, [open]);

  const actions = useMemo(() => [
    { id: "new-story", label: "New Story", icon: BookOpen, run: () => go("stories", { create: true }) },
    { id: "new-idea", label: "New Idea", icon: Lightbulb, run: () => go("ideas", { create: true }) },
    { id: "new-character", label: "New Character", icon: Users, run: () => go("characters", { create: true }) },
    {
      id: "new-chapter", label: "New Chapter", icon: FileText,
      run: () => {
        if (!ws.stories.length) { go("stories", { create: true }); return; }
        const target = [...ws.stories].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];
        go("write", { storyId: target.id, autoCreateChapter: true });
      },
    },
  ], [ws.stories, go]);
  const matchingActions = q.trim() ? actions.filter((a) => a.label.toLowerCase().includes(q.trim().toLowerCase())) : actions;

  const results = useMemo(() => {
    if (!q.trim()) return { stories: [], chapters: [], characters: [], ideas: [] };
    const lq = q.toLowerCase();
    const stories = ws.stories.filter((s) => s.title.toLowerCase().includes(lq));
    const chapters = ws.stories.flatMap((s) => s.chapters.filter((c) => c.title.toLowerCase().includes(lq)).map((c) => ({ ...c, storyTitle: s.title, storyId: s.id })));
    const characters = (ws.characters || []).filter((c) => c.name.toLowerCase().includes(lq));
    const ideas = ws.ideas.filter((i) => i.title.toLowerCase().includes(lq) || i.content.toLowerCase().includes(lq));
    return { stories, chapters, characters, ideas };
  }, [q, ws]);
  const hasAny = results.stories.length || results.chapters.length || results.characters.length || results.ideas.length;

  return (
    <Modal open={open} onClose={onClose} title="Search StoryDesk" width="max-w-lg">
      <div className="flex items-center gap-2 px-3 rounded-lg mb-3" style={{ background: "var(--bg-surface-2)", border: "1px solid var(--border)" }}>
        <Search size={16} style={{ color: "var(--text-faint)" }} />
        <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search, or type a command like “new story”..." className="flex-1 py-2.5 text-sm bg-transparent outline-none" style={{ color: "var(--text-primary)" }} />
      </div>
      {q.trim() && !hasAny && matchingActions.length === 0 && <p className="text-sm text-center py-6" style={{ color: "var(--text-faint)" }}>No results for "{q}"</p>}
      <div className="space-y-4 max-h-80 overflow-y-auto sd-scroll">
        {matchingActions.length > 0 && (
          <div><p className="text-xs font-semibold mb-1.5" style={{ color: "var(--text-faint)" }}>ACTIONS</p>
            {matchingActions.map((a) => (
              <button key={a.id} onClick={() => { a.run(); onClose(); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-left sd-focus" style={{ color: "var(--accent)" }}>
                <a.icon size={14} /> {a.label}
              </button>
            ))}
          </div>
        )}
        {results.stories.length > 0 && (
          <div><p className="text-xs font-semibold mb-1.5" style={{ color: "var(--text-faint)" }}>STORIES</p>
            {results.stories.map((s) => <button key={s.id} onClick={() => { go("story", { storyId: s.id }); onClose(); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-left sd-focus" style={{ color: "var(--text-primary)" }}><BookOpen size={14} /> {s.title}</button>)}
          </div>
        )}
        {results.chapters.length > 0 && (
          <div><p className="text-xs font-semibold mb-1.5" style={{ color: "var(--text-faint)" }}>CHAPTERS</p>
            {results.chapters.map((c) => <button key={c.id} onClick={() => { go("write", { storyId: c.storyId, chapterId: c.id }); onClose(); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-left sd-focus" style={{ color: "var(--text-primary)" }}><FileText size={14} /> {c.title} <span style={{ color: "var(--text-faint)" }}>· {c.storyTitle}</span></button>)}
          </div>
        )}
        {results.characters.length > 0 && (
          <div><p className="text-xs font-semibold mb-1.5" style={{ color: "var(--text-faint)" }}>CHARACTERS</p>
            {results.characters.map((c) => <button key={c.id} onClick={() => { go("characters", { openId: c.id }); onClose(); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-left sd-focus" style={{ color: "var(--text-primary)" }}><Users size={14} /> {c.name}</button>)}
          </div>
        )}
        {results.ideas.length > 0 && (
          <div><p className="text-xs font-semibold mb-1.5" style={{ color: "var(--text-faint)" }}>IDEAS</p>
            {results.ideas.map((i) => <button key={i.id} onClick={() => { go("ideas"); onClose(); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-left sd-focus" style={{ color: "var(--text-primary)" }}><Lightbulb size={14} /> {i.title}</button>)}
          </div>
        )}
      </div>
    </Modal>
  );
}

function OnboardingTour({ open, onClose }) {
  const [step, setStep] = useState(0);
  useEffect(() => { if (open) setStep(0); }, [open]);
  if (!open) return null;
  const steps = [
    { icon: PenLine, title: "Continue Writing", body: "Your Home screen always surfaces the story and chapter you last worked on, so you can pick up writing in one tap." },
    { icon: LayoutGrid, title: "Plan visually", body: "The Plan board lets you drag chapters across stages — Idea, Outline, Draft, Editing, Complete — like sticky notes on a board." },
    { icon: Download, title: "Export for Wattpad", body: "When a chapter's ready, open it in Write and tap Export to get clean, paste-ready text — or a full EPUB — for Wattpad." },
  ];
  const s = steps[step];
  const isLast = step === steps.length - 1;
  return (
    <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Welcome tour">
      <div className="absolute inset-0" style={{ background: "rgba(20,16,12,0.5)" }} onClick={onClose} />
      <div className="relative w-full max-w-sm sd-card rounded-2xl p-5 sd-anim" style={{ background: "var(--bg-surface)" }}>
        <div className="rounded-2xl p-3 inline-flex mb-3" style={{ background: "var(--accent-soft)" }}>
          <s.icon size={20} style={{ color: "var(--accent)" }} />
        </div>
        <h3 className="font-semibold text-base mb-1.5" style={{ color: "var(--text-primary)" }}>{s.title}</h3>
        <p className="text-sm mb-4" style={{ color: "var(--text-muted)" }}>{s.body}</p>
        <div className="flex items-center justify-between">
          <div className="flex gap-1">
            {steps.map((_, i) => (
              <div key={i} className="rounded-full" style={{ width: 6, height: 6, background: i === step ? "var(--accent)" : "var(--bg-sunken)" }} />
            ))}
          </div>
          <div className="flex items-center gap-3">
            <button onClick={onClose} className="text-sm font-medium sd-focus" style={{ color: "var(--text-faint)" }}>Skip</button>
            <Btn size="sm" variant="primary" onClick={() => { if (isLast) onClose(); else setStep((v) => v + 1); }}>{isLast ? "Got it" : "Next"}</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

export default function StoryDeskApp() {
  const { workspace, status, update, clearAll, setWorkspace, persistNow } = useWorkspace();
  const [view, setView] = useState("home");
  const [params, setParams] = useState({});
  const [subtab, setSubtab] = useState("overview");
  const [planStoryId, setPlanStoryId] = useState(null);
  const [showSearch, setShowSearch] = useState(false);
  const [showMore, setShowMore] = useState(false);
  const [showTour, setShowTour] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [systemDark, setSystemDark] = useState(false);

  useEffect(() => {
    if (window.matchMedia) {
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      setSystemDark(mq.matches);
      const handler = (e) => setSystemDark(e.matches);
      mq.addEventListener?.("change", handler);
      return () => mq.removeEventListener?.("change", handler);
    }
  }, []);

  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap";
    document.head.appendChild(link);
    return () => { document.head.removeChild(link); };
  }, []);

  function toast(message) {
    const id = uid("toast");
    setToasts((t) => [...t, { id, message }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2600);
  }

  function go(nextView, nextParams = {}) {
    setView(nextView);
    setParams(nextParams);
    if (nextView === "story") setSubtab(nextParams.newChapter ? "chapters" : "overview");
    window.scrollTo({ top: 0 });
  }

  useEffect(() => {
    function onKey(e) {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); setShowSearch(true); }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const autoBackupCheckedRef = useRef(false);
  useEffect(() => {
    if (!workspace || autoBackupCheckedRef.current) return;
    autoBackupCheckedRef.current = true;
    if (shouldTakeAutoBackup(workspace)) {
      const entry = makeAutoBackupEntry(workspace);
      update((w) => ({ ...w, autoBackups: [...(w.autoBackups || []), entry].slice(-AUTO_BACKUP_MAX_KEPT) }));
    }
  }, [workspace, update]);

  if (status === "loading") {
    return (
      <div className="storydesk min-h-screen flex items-center justify-center" style={{ background: "var(--bg-paper)" }}>
        <style>{THEME_CSS}</style>
        <Feather size={22} style={{ color: "var(--accent)" }} className="animate-pulse" />
      </div>
    );
  }

  if (!workspace) {
    return (
      <Onboarding
        onStart={async (demo) => {
          const ws = demo ? makeSampleWorkspace() : emptyWorkspace();
          if (!ws.characters) ws.characters = [];
          ws.tourSeen = true;
          setWorkspace(ws);
          try { await window.storage.set(STORAGE_KEY, JSON.stringify(ws), false); } catch (e) {}
          setShowTour(true);
        }}
      />
    );
  }

  const ws = { characters: [], ...workspace };
  const isDark = ws.settings.theme === "dark" || (ws.settings.theme === "system" && systemDark);

  function setThemePref(pref) { update((w) => ({ ...w, settings: { ...w.settings, theme: pref } })); }

  async function loadSampleData() {
    const sample = makeSampleWorkspace();
    if (!sample.characters) sample.characters = [];
    setWorkspace(sample);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(sample), false); } catch (e) { /* noop */ }
  }

  let page;
  if (view === "home") page = <Home ws={ws} update={update} go={go} toast={toast} />;
  else if (view === "stories") page = <Stories ws={ws} update={update} go={go} toast={toast} initialCreate={params.create} />;
  else if (view === "story") page = <StoryDetail ws={ws} update={update} storyId={params.storyId} go={go} toast={toast} subtab={subtab} setSubtab={setSubtab} />;
  else if (view === "write") page = <Write ws={ws} update={update} storyId={params.storyId} chapterId={params.chapterId} go={go} toast={toast} autoCreateChapter={params.autoCreateChapter} />;
  else if (view === "plan") page = <PlanPage ws={ws} update={update} go={go} toast={toast} planStoryId={planStoryId || params.storyId} setPlanStoryId={setPlanStoryId} />;
  else if (view === "characters") page = <Characters ws={ws} update={update} go={go} toast={toast} initialCreate={params.create} initialOpenId={params.openId} initialStoryId={params.storyId} />;
  else if (view === "ideas") page = <Ideas ws={ws} update={update} go={go} toast={toast} initialCreate={params.create} />;
  else if (view === "progress") page = <Progress ws={ws} update={update} toast={toast} />;
  else if (view === "settings") page = <Settings ws={ws} update={update} clearAll={clearAll} toast={toast} theme={isDark ? "dark" : "light"} setThemePref={setThemePref} onLoadSample={loadSampleData} />;
  else if (view === "more") { page = <Home ws={ws} update={update} go={go} toast={toast} />; }

  return (
    <div className={`storydesk ${isDark ? "dark" : ""}`} style={{ minHeight: "100vh", background: "var(--bg-paper)" }}>
      <style>{THEME_CSS}</style>
      <div className="md:flex">
        <Sidebar view={view} setView={(v) => go(v)} onSearch={() => setShowSearch(true)} />
        <main className="flex-1 min-w-0">{page}</main>
      </div>
      <MobileNav view={view} setView={(v) => (v === "more" ? setShowMore(true) : go(v))} />
      <MoreSheet open={showMore} onClose={() => setShowMore(false)} setView={(v) => go(v)} />
      <SearchPalette open={showSearch} onClose={() => setShowSearch(false)} ws={ws} go={go} />
      <OnboardingTour open={showTour} onClose={() => setShowTour(false)} />
      <ToastHost toasts={toasts} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<StoryDeskApp />);
</script>
<script>
  (function boot() {
    try {
      var source = document.getElementById("app-source").textContent;
      var transformed = Babel.transform(source, {
        presets: ["react"],
        sourceType: "module",
        filename: "storydesk-app.jsx",
      }).code;
      var blob = new Blob([transformed], { type: "text/javascript" });
      var url = URL.createObjectURL(blob);
      import(/* webpackIgnore: true */ url).catch(function (err) {
        showBootError("Failed to run the app module: " + (err && err.message ? err.message : err));
      });
    } catch (err) {
      showBootError("Failed to compile the app: " + (err && err.message ? err.message : err));
    }
  })();
</script>
</body>
</html>
